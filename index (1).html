  };

  const SAVE_KEY = 'agencia-detectives-v1';
  G.defaultSave = () => ({
    v: 1,
    money: 0,
    rep: 0,
    upgrades: {},
    done: {}, // caseId -> { best: {difficulty: stars}, count }

    mouse: { x: 0, y: 0, down: false, clicked: false, moved: false },
    p: [newPad(), newPad()],
    menu: { up: false, down: false, left: false, right: false, ok: false, back: false },

    up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
    action: ['KeyE', 'Enter', 'Space', 'TouchA'], tool: ['KeyQ', 'ShiftRight', 'ShiftLeft', 'TouchT'], book: ['KeyF', 'Period'],

        my = (anyDown(sc.down) ? 1 : 0) - (anyDown(sc.up) ? 1 : 0);

        actionDown = anyDown(sc.action);

        if (Math.abs(ay) > dz) my = ay;
        if (pad.buttons[14] && pad.buttons[14].pressed) mx = -1;
        if (pad.buttons[15] && pad.buttons[15].pressed) mx = 1;
        if (pad.buttons[12] && pad.buttons[12].pressed) my = -1;
        if (pad.buttons[13] && pad.buttons[13].pressed) my = 1;
        const b = (n) => !!(pad.buttons[n] && pad.buttons[n].pressed);
        const prev = padPrev[i];
        const cur = { a: b(0), x: b(2), y: b(3), sel: b(8), st: b(9), bk: b(1) };

        if (cur.a) actionDown = true;

        if (cur.x) toolDown = true;
        if (cur.y && !prev.y) book = true;

        o._padPause = cur.st && !prev.st;
        o._padBack = cur.bk && !prev.bk;
        padPrev[i] = cur;
      } else {
        o._padSwap = o._padPause = o._padBack = false;
      }

      if (len > 1) { mx /= len; my /= len; }
      o.mx = mx; o.my = my; o.action = action; o.actionDown = actionDown; o.tool = tool; o.toolDown = toolDown; o.book = book;
    }
    const lbNow = !!(pads[0] && pads[0].buttons[4] && pads[0].buttons[4].pressed);
    I.hint = anyPress(['KeyH']) || (lbNow && !I._lbPrev);
    I._lbPrev = lbNow;
    I.p[0].swap = anyPress(['Tab']) || I.p[0]._padSwap;
    I.p[0].pause = anyPress(['Escape', 'KeyP']) || I.p[0]._padPause || I.p[1]._padPause;
    // menús (cualquier jugador)
    const m = I.menu;
    const gp = pads[0];
    const gpPress = (n) => !!(gp && gp.buttons[n] && gp.buttons[n].pressed && !padPrev.menuPrev?.[n]);
    m.up = anyPress(['KeyW', 'ArrowUp']);
    m.down = anyPress(['KeyS', 'ArrowDown']);
    m.left = anyPress(['KeyA', 'ArrowLeft']);
    m.right = anyPress(['KeyD', 'ArrowRight']);
    m.ok = anyPress(['Enter', 'KeyE', 'Space']) || I.p[0]._padA || false;
    m.back = anyPress(['Escape', 'Backspace', 'KeyQ']) || I.p[0]._padBack || I.p[1]._padBack;
    // mando en menús
    let nowM = {};
    if (gp) {
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      nowM = { 12: gp.buttons[12]?.pressed || ay < -0.5, 13: gp.buttons[13]?.pressed || ay > 0.5, 14: gp.buttons[14]?.pressed || ax < -0.5, 15: gp.buttons[15]?.pressed || ax > 0.5, 0: gp.buttons[0]?.pressed };

      if (nowM[13] && !pm[13]) m.down = true;
      if (nowM[14] && !pm[14]) m.left = true;
      if (nowM[15] && !pm[15]) m.right = true;
      if (nowM[0] && !pm[0]) m.ok = true;
    }

  };
  I.endFrame = function () {
    Object.keys(pressedKeys).forEach((k) => delete pressedKeys[k]);
    I.mouse.clicked = false;
    I.mouse.moved = false;
    I.anyPressed = false;
  };

  // ---------- audio procedural ----------
  const A = (G.audio = {
    ctx: null,
    master: null,
    ready: false,
    nextBeat: 0,
    beat: 0,
    mode: 'off',
    musicGain: null,

        this.musicGain.gain.value = 0.5;

    tone(freq, dur, type, vol, slide, delay, dest) {

      g.connect(dest || this.master);
      o.start(t);
      o.stop(t + dur + 0.05);

    sfx(name) {
      if (!this.ready || !G.save.data.settings.sfx) return;
      const T = (f, d, ty, v, s, dl) => this.tone(f, d, ty, v, s, dl);
      switch (name) {
        case 'select': T(520, 0.06, 'square', 0.08); break;
        case 'ok': T(660, 0.07, 'square', 0.1); T(880, 0.09, 'square', 0.1, 0, 0.06); break;
        case 'back': T(440, 0.08, 'square', 0.09, 0.6); break;
        case 'error': T(200, 0.18, 'sawtooth', 0.12, 0.7); break;
        case 'pickup': T(700, 0.07, 'triangle', 0.14); T(1050, 0.12, 'triangle', 0.14, 0, 0.07); break;
        case 'clue': [523, 659, 784, 1047].forEach((f, i) => T(f, 0.14, 'triangle', 0.14, 0, i * 0.07)); break;
        case 'unlock': T(300, 0.05, 'square', 0.1); T(450, 0.05, 'square', 0.1, 0, 0.08); T(900, 0.14, 'triangle', 0.14, 0, 0.16); break;
        case 'door': T(180, 0.15, 'triangle', 0.15, 0.6); break;
        case 'tool': T(420, 0.05, 'square', 0.07); break;
        case 'work': T(300 + Math.random() * 120, 0.04, 'square', 0.05); break;
        case 'hint': T(880, 0.1, 'sine', 0.12); T(880, 0.1, 'sine', 0.1, 0, 0.14); break;
        case 'talk': T(240 + Math.random() * 160, 0.035, 'square', 0.05); break;
        case 'crack': [392, 330, 262].forEach((f, i) => T(f, 0.16, 'sawtooth', 0.1, 0.9, i * 0.1)); break;
        case 'success': [523, 659, 784, 659, 784, 1047].forEach((f, i) => T(f, 0.16, 'triangle', 0.15, 0, i * 0.09)); break;
        case 'fanfare': [392, 392, 392, 523, 659, 523, 659, 784].forEach((f, i) => T(f, 0.2, 'triangle', 0.16, 0, i * 0.12)); break;
        case 'boing': T(200, 0.3, 'sine', 0.2, 3); break;
        case 'meow': T(700, 0.25, 'triangle', 0.1, 1.6); T(900, 0.2, 'triangle', 0.08, 0.7, 0.2); break;

    },
    setMode(m) {
      if (this.mode !== m) {
        this.mode = m;
        this.beat = 0;
        if (this.ready) this.nextBeat = this.ctx.currentTime + 0.05;
      }
    },
    // Música: bajo "caminante" + vibráfono suave con acordes de jazz ligero.

      if (!this.ready) return;
      const on = G.save.data.settings.music && this.mode !== 'off';
      this.musicGain.gain.value = on ? 0.5 : 0;
      if (!on) { this.nextBeat = this.ctx.currentTime + 0.1; return; }
      const bpm = this.mode === 'tense' ? 124 : this.mode === 'office' ? 96 : 108;
      const step = 60 / bpm / 2;
      const chords = [
        { root: 50, tones: [62, 65, 69, 72] }, // Dm7
        { root: 43, tones: [59, 62, 65, 69] }, // G7
        { root: 48, tones: [60, 64, 67, 71] }, // Cmaj7
        { root: 45, tones: [61, 64, 67, 71] }, // A7

        }

          this.tone(mf(n), step * 3, 'sine', 0.09, 0, t, this.musicGain);
        }
        if (this.mode === 'tense' && k % 2 === 1) this.tone(mf(ch.tones[0] - 12), 0.05, 'square', 0.03, 0, t, this.musicGain);
        if (this.mode !== 'office' && k === 4) this.tone(mf(ch.tones[(b + 1) % 4] + 12), step * 2, 'sine', 0.05, 0, t, this.musicGain);

      hintFirst: Infinity, hintEvery: Infinity, sparkle: 'never', stubborn: 1, mult: 2.4, wrongPenalty: 0.35, wrongTime: 60, strikes: 2, timeLimit: 1.2, board: 4,
      companion: 'ask', hideSuspects: false, autoMark: false, hintCost: 25,
    },
  };

  // ---------------------------------------------------------------- MEJORAS (progresión)
  G.UPGRADES = [
    { id: 'lupa', name: 'Lupa de precisión', icon: 'ico_lupa', max: 3, costs: [80, 170, 300], desc: 'La lupa examina más rápido (-22% por nivel).' },
    { id: 'ganzua', name: 'Ganzúas profesionales', icon: 'ico_ganzua', max: 3, costs: [80, 170, 300], desc: 'Abres cerraduras más rápido (-22% por nivel).' },
    { id: 'uv', name: 'Linterna UV potente', icon: 'ico_uv', max: 3, costs: [90, 180, 320], desc: 'El haz de luz UV es más ancho.' },
    { id: 'grabadora', name: 'Micrófono directivo', icon: 'ico_rec', max: 3, costs: [90, 180, 320], desc: 'Grabas más rápido y desde más lejos.' },
    { id: 'botas', name: 'Zapatillas de sigilo', icon: 'ico_arrow', max: 3, costs: [60, 140, 260], desc: 'Los detectives caminan más rápido.' },
    { id: 'olfato', name: 'Olfato de sabueso', icon: 'ico_bulb', max: 2, costs: [150, 320], desc: 'Las pistas cercanas brillan un poquito, hasta en Difícil.' },
    { id: 'cuaderno', name: 'Cuaderno de bolsillo', icon: 'ico_book', max: 2, costs: [120, 260], desc: 'Consigues pistas gratis por caso (1 y 2).' },
  ];
  G.upgLevel = (id) => (G.save && G.save.data.upgrades[id]) || 0;
  G.stats = function () {
    const l = G.upgLevel;
    return {
      speed: 74 + l('botas') * 7,
      toolMul: { lupa: 1 - 0.22 * l('lupa'), ganzua: 1 - 0.22 * l('ganzua'), uv: 1, grabadora: 1 - 0.2 * l('grabadora') },
      uvRadius: 88 + l('uv') * 22,
      listenRange: 1 + l('grabadora') * 0.5,
      sniff: l('olfato') * 40,
      freeHints: l('cuaderno'),
    };
  };

  // ---------------------------------------------------------------- CONDICIONES
  function evalCond(c, st, npcId) {
    if (!c) return true;
    if (c.any && !c.any.some((x) => evalCond(x, st, npcId))) return false;
    if (c.not && evalCond(c.not, st, npcId)) return false;
    const n = (npcId && st.npc[npcId]) || { trust: 0, pressure: 0 };
    const arr = (v) => [].concat(v);
    if (c.clue && !arr(c.clue).every((id) => st.hasClue(id))) return false;
    if (c.notClue && arr(c.notClue).some((id) => st.hasClue(id))) return false;
    if (c.anyClue && !arr(c.anyClue).some((id) => st.hasClue(id))) return false;
    if (c.flag && !arr(c.flag).every((f) => st.flags[f])) return false;
    if (c.notFlag && arr(c.notFlag).some((f) => st.flags[f])) return false;
    if (c.trustMin !== undefined && n.trust < c.trustMin) return false;
    if (c.trustMax !== undefined && n.trust > c.trustMax) return false;
    if (c.pressureMin !== undefined && n.pressure < c.pressureMin + (st.diff ? st.diff.stubborn : 0)) return false;
    if (c.chapterMin !== undefined && st.chapter < c.chapterMin) return false;
    if (c.chapterMax !== undefined && st.chapter > c.chapterMax) return false;
    if (c.flagCountMin) {
      let k = 0;
      Object.keys(st.flags).forEach((f) => { if (st.flags[f] && f.indexOf(c.flagCountMin.prefix) === 0) k++; });
      if (k < c.flagCountMin.min) return false;
    }
    return true;
  }
  G.evalCond = evalCond;

  // ---------------------------------------------------------------- ESTADO DEL CASO
  class CaseState {
    constructor(def, diffId) {
      this.def = def;
      this.diffId = diffId;
      this.diff = G.DIFFS[diffId];
      this.time = 0;
      this.chapter = 1;
      this.clues = {};
      this.clueOrder = [];
      this.flags = {};
      this.npc = {};
      this.shown = {};
      this.asked = {};
      this.progress = {};
      this.moved = {};
      this.wrong = 0;
      this.hintsUsed = 0;
      this.freeHints = G.stats ? G.stats().freeHints : 0;
      this.events = [];
      this.closed = false;
      this.failed = false;
      this.bonusMoney = 0;
      this.timePenalty = 0;
      Object.keys(def.npcs).forEach((id) => (this.npc[id] = { trust: 0, pressure: 0, lockedUntil: 0, talks: 0, chats: 0, presses: 0 }));
    }
    hasClue(id) { return !!this.clues[id]; }
    clueCount() { return this.clueOrder.length; }
    totalClues() { return Object.keys(this.def.clues).length; }
    setFlag(f, v) {
      if (v === false) delete this.flags[f];
      else if (!this.flags[f]) { this.flags[f] = true; this.events.push({ type: 'flag', id: f }); }
    }
    addClue(id, via) {
      if (!this.def.clues[id] || this.clues[id]) return false;
      this.clues[id] = { t: this.time, via: via || '' };
      this.clueOrder.push(id);
      this.events.push({ type: 'clue', id });
      return true;
    }
    elapsed() { return this.time + this.timePenalty; }
    timeLimit() { return this.diff.timeLimit ? this.def.parSeconds * this.diff.timeLimit : 0; }
    timeLeft() { const l = this.timeLimit(); return l ? l - this.elapsed() : Infinity; }

    // ---- capítulos
    chapterDef() { return this.def.chapters[this.chapter - 1]; }
    goalDone(g) {
      if (g.clue) return this.hasClue(g.clue);
      if (g.clues) return g.clues.filter((c) => this.hasClue(c)).length >= (g.min || g.clues.length);
      if (g.flags) return g.flags.filter((f) => this.flags[f]).length >= (g.min || g.flags.length);
      return false;
    }
    goalProgress(g) {
      if (g.clue) return this.hasClue(g.clue) ? [1, 1] : [0, 1];
      if (g.clues) return [Math.min(g.clues.filter((c) => this.hasClue(c)).length, g.min || g.clues.length), g.min || g.clues.length];
      if (g.flags) return [Math.min(g.flags.filter((f) => this.flags[f]).length, g.min || g.flags.length), g.min || g.flags.length];
      return [0, 1];
    }
    goals() { return this.chapterDef().goals.map((g) => ({ id: g.id, text: g.text, done: this.goalDone(g), prog: this.goalProgress(g), def: g })); }
    checkAdvance() {
      const ch = this.chapterDef();
      if (this.chapter >= this.def.chapters.length) return false;
      if (ch.goals.every((g) => this.goalDone(g))) {
        const from = this.chapter;
        this.chapter++;
        this.events.push({ type: 'chapter', from, to: this.chapter });
        return true;
      }
      return false;
    }

    // ---- personajes presentes
    placementOf(npcId) {
      const list = this.def.placement && this.def.placement[npcId];
      if (!list) return null;
      let cur = null;
      list.forEach((p) => { if (p.ch <= this.chapter) cur = p; });
      return cur;
    }
    npcsIn(roomId) {
      return Object.keys(this.def.npcs).filter((id) => {
        const p = this.placementOf(id);
        return p && p.room === roomId;
      });
    }

    // ---- diálogos
    isLocked(npcId) { return this.npc[npcId].lockedUntil > this.time; }
    lockLeft(npcId) { return Math.max(0, this.npc[npcId].lockedUntil - this.time); }
    topicsFor(npcId) {
      const nd = this.def.npcs[npcId];
      return nd.topics.filter((t) => evalCond(t.show, this, npcId)).map((t) => ({ id: t.id, label: t.label, seen: !!this.asked[npcId + ':' + t.id] }));
    }
    _apply(fx, npcId, out) {
      if (!fx) return;
      const n = npcId && this.npc[npcId];
      if (fx.clue) [].concat(fx.clue).forEach((c) => { if (this.addClue(c, npcId)) (out.newClues = out.newClues || []).push(c); });
      if (fx.flag) [].concat(fx.flag).forEach((f) => this.setFlag(f));
      if (fx.unflag) [].concat(fx.unflag).forEach((f) => this.setFlag(f, false));
      if (n && fx.trust) n.trust = G.clamp(n.trust + fx.trust, 0, 6);
      if (n && fx.pressure) n.pressure = G.clamp(n.pressure + fx.pressure, 0, 8);
      if (n && fx.lockFor && this.diff.id !== 'easy') { n.lockedUntil = this.time + fx.lockFor; out.locked = true; }
      if (fx.money) this.bonusMoney += fx.money;
      if (fx.sfx) out.sfx = fx.sfx;
    }
    _run(list, npcId) {
      const nd = this.def.npcs[npcId];
      const out = { lines: [], who: npcId, sfx: null };
      const norm = (list || []).map((e) => (Array.isArray(e) ? { say: e } : e));
      const hit = norm.find((r) => evalCond(r.when, this, npcId));
      if (hit) {
        out.lines = hit.say.slice();
        this._apply(hit.fx, npcId, out);
      }
      out.name = nd.name;
      this.checkAdvance();
      return out;
    }
    lockedReply(npcId) {
      const nd = this.def.npcs[npcId];
      return { lines: [`(${nd.name} se ha cerrado en banda. Dale ${Math.ceil(this.lockLeft(npcId))} segundos para que se calme.)`], who: 'narrator', locked: true, name: nd.name };
    }
    startTalk(npcId) {
      const n = this.npc[npcId];
      const first = n.talks === 0;
      n.talks++;
      this.setFlag('talked_' + npcId);
      this.checkAdvance();
      return first ? { lines: this.def.npcs[npcId].first.slice(), who: npcId, name: this.def.npcs[npcId].name } : null;
    }
    ask(npcId, topicId) {
      if (this.isLocked(npcId)) return this.lockedReply(npcId);
      const nd = this.def.npcs[npcId];
      const t = nd.topics.find((x) => x.id === topicId);
      this.asked[npcId + ':' + topicId] = true;
      return this._run(t.responses, npcId);
    }
    chat(npcId) {
      if (this.isLocked(npcId)) return this.lockedReply(npcId);
      const n = this.npc[npcId];
      const nd = this.def.npcs[npcId];
      n.trust = G.clamp(n.trust + 1, 0, 6);
      n.pressure = Math.max(0, n.pressure - 1);
      const list = nd.chat || [['...']];
      const out = this._run([list[n.chats % list.length]], npcId);
      n.chats++;
      if (nd.cat && n.chats === 3 && !this.flags.cat_reward) {
        this.setFlag('cat_reward');
        this.bonusMoney += nd.petReward || 10;
        out.lines.push('(Bigotes deja una moneda a tus pies. Debe de ser un gato con ahorros.)');
        out.sfx = 'pickup';
      }
      return out;
    }
    press(npcId) {
      if (this.isLocked(npcId)) return this.lockedReply(npcId);
      const n = this.npc[npcId];
      const nd = this.def.npcs[npcId];
      n.pressure = G.clamp(n.pressure + 1, 0, 8);
      n.presses++;
      return this._run(nd.press, npcId);
    }
    present(npcId, clueId) {
      if (this.isLocked(npcId)) return this.lockedReply(npcId);
      const nd = this.def.npcs[npcId];
      if (this.def.solution.proof.indexOf(clueId) >= 0) this.setFlag(`${npcId}_pres_${clueId}`);
      this.shown[npcId + ':' + clueId] = true;
      const list = nd.evidence[clueId] || nd.evidence['*'] || [{ say: nd.evidenceDefault }];
      let out = this._run(list, npcId);
      if (!out.lines.length) out = this._run([{ say: nd.evidenceDefault }], npcId);
      return out;
    }

    // ---- sospechosos
    suspectCleared(sid) {
      const s = this.def.suspects.find((x) => x.id === sid);
      return !!s && s.clearedBy.length > 0 && s.clearedBy.every((c) => this.hasClue(c));
    }
    suspicion(sid) {
      let v = 0;
      this.clueOrder.forEach((c) => { const s = this.def.clues[c].sus; if (s && s[sid]) v += s[sid]; });
      return v;
    }
    topSuspect() {
      let best = null, bv = 0;
      this.def.suspects.forEach((s) => { const v = this.suspicion(s.id); if (v > bv && !this.suspectCleared(s.id)) { bv = v; best = s.id; } });
      return best && bv >= 2 ? best : null;
    }

    // ---- acceso y siguiente acción (motor de pistas)
    roomAccessible(roomId) {
      if (roomId === 'tienda' || roomId === 'cocina') return true;
      let ok = false;
      Object.keys(this.def.rooms).forEach((rid) => {
        this.def.rooms[rid].doors.forEach((d) => {
          if (d.to.room === roomId) {
            if (!d.locked || this.chapter >= (d.locked.chapterMin || 1)) ok = true;
          }
        });
      });
      return ok;
    }
    propVisible(p) { return !p.visible || evalCond(p.visible, this, null); }
    propDone(p) { return p.steps && (this.progress[p.id] || 0) >= p.steps.length; }
    propStep(p) { return p.steps ? p.steps[this.progress[p.id] || 0] : null; }
    nextAction() {
      const def = this.def;
      const goals = this.goals().filter((g) => !g.done);
      const goalClues = new Set();
      goals.forEach((g) => (g.def.clues || (g.def.clue ? [g.def.clue] : [])).forEach((c) => goalClues.add(c)));
      const cands = [];
      Object.keys(def.rooms).forEach((rid) => {
        if (!this.roomAccessible(rid)) return;
        def.rooms[rid].props.forEach((p) => {
          if (!p.steps || this.propDone(p) || !this.propVisible(p)) return;
          const step = this.propStep(p);
          if (step.requires && !evalCond(step.requires, this, null)) return;
          const pr = step.clue && goalClues.has(step.clue) ? 0 : step.clue && !this.hasClue(step.clue) ? 1 : 2;
          cands.push({ kind: 'prop', room: rid, id: p.id, label: p.label || 'algo', tool: step.tool, pr, step });
        });
        def.rooms[rid].doors.forEach((d) => {
          if (d.firstOpen && !this.hasClue(d.firstOpen.clue) && (!d.locked || this.chapter >= (d.locked.chapterMin || 1))) {
            cands.push({ kind: 'door', room: rid, id: d.id, label: d.label ? 'la puerta: ' + d.label : 'una puerta', pr: goalClues.has(d.firstOpen.clue) ? 0 : 1 });
          }
          if (d.locked && !this.flags['unlocked_' + d.id] && this.chapter >= (d.locked.chapterMin || 1) && d.locked.tool) {
            cands.push({ kind: 'door', room: rid, id: d.id, label: 'la puerta: ' + d.label, tool: d.locked.tool, pr: 1 });
          }
        });
      });
      cands.sort((a, b) => a.pr - b.pr);
      const best = cands.find((c) => c.pr === 0) || null;
      if (best) return this._describe(best);
      // personajes
      const npcCands = [];
      Object.keys(def.npcs).forEach((nid) => {
        const pl = this.placementOf(nid);
        if (!pl || !this.roomAccessible(pl.room) || def.npcs[nid].cat) return;
        const nd = def.npcs[nid];
        if (!this.flags['talked_' + nid]) npcCands.push({ kind: 'npc', room: pl.room, id: nid, label: nd.name, text1: `Aún no has hablado con ${nd.name}.`, pr: goals.some((g) => g.def.flags) ? 0 : 1 });
        else {
          this.clueOrder.forEach((c) => {
            if (!this.shown[nid + ':' + c] && (nd.evidence[c] || (nd.evidence['*'] && def.solution.proof.indexOf(c) >= 0))) npcCands.push({ kind: 'npc', room: pl.room, id: nid, label: nd.name, text1: `Enseñar «${def.clues[c].title}» a ${nd.name} podría dar resultado.`, clue: c, pr: 1 });
          });
          this.topicsFor(nid).filter((t) => !t.seen).forEach((t) => npcCands.push({ kind: 'npc', room: pl.room, id: nid, label: nd.name, text1: `Pregúntale a ${nd.name}: «${t.label}»`, pr: 1 }));
        }
      });
      if (npcCands.length && (!cands.length || npcCands.some((c) => c.pr === 0))) {
        npcCands.sort((a, b) => a.pr - b.pr);
        return this._describe(npcCands[0]);
      }
      if (cands.length) return this._describe(cands[0]);
      if (npcCands.length) return this._describe(npcCands[0]);
      if (this.chapter >= def.chapters.length) return { kind: 'accuse', room: null, id: null, text1: 'Creo que ya tenemos suficiente: ¡abrid el cuaderno y acusad!', text2: 'Abre el cuaderno y pulsa «Acusar».' };
      return null;
    }
    _describe(c) {
      const rn = this.def.rooms[c.room] ? this.def.rooms[c.room].name : '';
      if (c.kind === 'npc') return { kind: 'npc', room: c.room, id: c.id, text1: c.text1, text2: c.text1, clue: c.clue };
      const t = c.tool ? ` (hace falta ${G.TOOLS[c.tool] ? G.TOOLS[c.tool].name : c.tool})` : '';
      return { kind: c.kind, room: c.room, id: c.id, tool: c.tool, text1: `Creo que en «${rn}» hay algo que merece otra mirada.`, text2: `Fíjate en ${c.label}${t}.` };
    }

    // ---- acusación
    boardOptions() {
      const d = this.diff;
      return { suspects: this.def.suspects.filter((s) => !(d.hideSuspects && s.easyHidden)), method: d.board >= 2, motive: d.board >= 2, proof: d.board >= 4 };
    }
    accuse(sel) {
      const sol = this.def.solution;
      const opt = this.boardOptions();
      const res = { culpritOk: sel.culprit === sol.culprit, methodOk: !opt.method || sel.method === sol.method, motiveOk: !opt.motive || sel.motive === sol.motive, proofOk: true };
      if (opt.proof) {
        const good = (sel.proof || []).filter((p) => sol.proof.indexOf(p) >= 0 && this.hasClue(p));
        res.proofOk = new Set(good).size >= 2;
      }
      res.ok = res.culpritOk && res.methodOk && res.motiveOk && res.proofOk;
      if (res.ok) {
        this.closed = true;
        this.setFlag('case_closed');
        this.checkAdvance();
      } else {
        this.wrong++;
        this.timePenalty += this.diff.wrongTime;
        if (this.wrong >= this.diff.strikes) { this.failed = true; res.failed = true; }
      }
      res.strikesLeft = this.diff.strikes < 90 ? this.diff.strikes - this.wrong : null;
      return res;
    }
    reward() {
      const def = this.def, d = this.diff;
      const foundFrac = this.clueCount() / this.totalClues();
      let stars = 1;
      if (this.elapsed() <= def.parSeconds) stars++;
      if (this.wrong === 0 && foundFrac >= 0.8) stars++;
      if (this.failed || !this.closed) stars = 0;
      const base = this.closed ? def.reward * d.mult * (1 + 0.25 * (stars - 1)) : Math.round(def.reward * 0.15);
      const pen = Math.min(0.6, d.wrongPenalty * this.wrong);
      const money = Math.round(base * (1 - pen)) + this.bonusMoney;
      return { stars, money, rep: stars * 5, foundFrac, time: this.elapsed() };
    }
  }
  G.CaseState = CaseState;

  // ---------------------------------------------------------------- DIRECTOR DE RITMO
  G.Director = class {
    constructor(st) {
      this.st = st;
      this.idle = 0;
      this.tier = 0;
      this.frustration = 0;
      this.lastClues = 0;
      this.cluesTimes = [];
      this.pending = null;
    }
    bump() { this.idle = 0; this.tier = 0; }
    denied() { this.frustration = Math.min(8, this.frustration + 1); }
    adapt() {
      if (!G.save.data.settings.adaptive) return 1;
      let a = 1 / (1 + 0.12 * this.frustration);
      if (this.cluesTimes.length >= 2) {
        const gaps = [];
        for (let i = 1; i < this.cluesTimes.length; i++) gaps.push(this.cluesTimes[i] - this.cluesTimes[i - 1]);
        const avg = gaps.reduce((s, v) => s + v, 0) / gaps.length;
        if (avg < 50) a *= 1.35;
      }
      return a;
    }
    update(dt, active) {
      const st = this.st;
      if (st.clueCount() !== this.lastClues) {
        this.lastClues = st.clueCount();
        this.cluesTimes.push(st.time);
        if (this.cluesTimes.length > 5) this.cluesTimes.shift();
        this.bump();
        this.frustration = Math.max(0, this.frustration - 2);
      }
      if (!active) return null;
      this.idle += dt;
      this.frustration = Math.max(0, this.frustration - dt * 0.02);
      const d = st.diff;
      const first = d.hintFirst * this.adapt();
      const every = d.hintEvery * this.adapt();
      if (!isFinite(first)) return null;
      const need = first + this.tier * every;
      if (this.idle >= need && this.tier < 3) {
        this.tier++;
        return { tier: this.tier, action: st.nextAction() };
      }
      return null;
    }
    request() {
      const st = this.st;
      const free = st.freeHints > 0;
      if (free) st.freeHints--;
      else st.timePenalty += st.diff.hintCost;
      st.hintsUsed++;
      this.tier = Math.min(3, Math.max(this.tier + 1, 1));
      this.idle = 0;
      return { tier: this.tier, action: st.nextAction(), free };
    }
  };

  // ---------------------------------------------------------------- VALIDADOR DE CASOS
  // Comprueba la estructura y SIMULA una partida perfecta para garantizar que el caso tiene solución.
  G.validateCase = function (def) {
    const errors = [], warnings = [];
    const E = (m) => errors.push(m), W = (m) => warnings.push(m);
    const spr = (n, where) => { if (n && !G.spr[n]) E(`Sprite inexistente "${n}" en ${where}`); };
    const clueIds = Object.keys(def.clues);

    // --- estructura de salas
    Object.keys(def.rooms).forEach((rid) => {
      const r = def.rooms[rid];
      const w = r.map[0].length;
      r.map.forEach((row, i) => { if (row.length !== w) E(`Sala ${rid}: la fila ${i} tiene ${row.length} columnas y debería tener ${w}`); });
      const H = r.map.length;
      const solidAt = (x, y) => r.map[y] && r.map[y][x] === '#';
      const seen = {};
      r.props.forEach((p) => {
        if (seen[p.id]) E(`Sala ${rid}: id de objeto repetido "${p.id}"`);
        seen[p.id] = true;
        if (p.x < 0 || p.y < 0 || p.x >= w || p.y >= H) E(`Sala ${rid}: objeto ${p.id} fuera del mapa (${p.x},${p.y})`);
        spr(p.sprite, `objeto ${p.id}`);
        if (p.swap) spr(p.swap.sprite, `objeto ${p.id} (swap)`);
        if (p.uvMark) spr(p.uvMark.sprite, `objeto ${p.id} (uvMark)`);
        if (p.steps) p.steps.forEach((s, i) => {

    }
    callPartner(a, f) {
      if (this.aiActive()) {
        const ai = this.players[1 - this.human];
        if (ai.task && ai.task.f === f.p) return;
        this.dispatch(ai, f);
      } else {
        const owner = G.toolOwner(f.needs);
        if (this.mode === 'online') this.out.push({ t: 'call', label: f.label, tool: f.needs });
        a.say(this.mode === 'online' ? '¡Aviso enviado a ' + (owner === 'luna' ? 'Luna' : 'Rex') + '! Necesito su ' + G.TOOLS[f.needs].name : owner === 'luna' ? '¡Eso es trabajo para Luna! (' + G.TOOLS[f.needs].name + ')' : '¡Eso es trabajo para Rex! (' + G.TOOLS[f.needs].name + ')', 2.6);
        G.audio.sfx('error');
        this.out.push({ t: 'denied_soft' });
      }
    }
    startWork(a, kind, target, step, f) {
      const tool = step.tool && step.tool !== 'coop' ? step.tool : null;
      const dur = this.stepDuration(tool, step);
      a.work = { kind, target, step, tool, t: 0, dur, tick: 0, x0: a.x, y0: a.y, watcher: kind === 'prop' && target.watcher ? target.watcher : null };
      G.audio.sfx(tool ? 'tool' : 'select');
    }
    startCoop(a, p, step) {
      if (!this.coopWork || this.coopWork.p !== p) this.coopWork = { p, step, idx: st0(this, p), t: 0, dur: step.time || 2.2, idle: 0, warned: false };
      this.faceToward(a, (p.x + p.w / 2) * TS, (p.y + p.h / 2) * TS);
      if (this.mode === 'online' && !this.aiTakeover) this.out.push({ t: 'call', label: p.label || 'objeto', tool: 'coop' });
      if (this.aiActive()) {
        const ai = this.players[1 - this.human];

      }
    }
    useDoor(d) {
      this.out.push({ t: 'door', door: d });
    }
    completeStep(p, step, a) {
      const st = this.st;
      st.progress[p.key] = (st.progress[p.key] || 0) + 1;
      const fx = step.fx;
      if (fx) {
        if (fx.flag) st.setFlag(fx.flag);

          if (q) {

            const mv = st.moved[q.id] || { dx: 0, dy: 0 };
            mv.dx += fx.moveProp.dx; mv.dy += fx.moveProp.dy; st.moved[q.id] = mv;
            this.room.rebuild();
            this.puff((q.x + 0.5) * TS, (q.y + 0.8) * TS);
            G.audio.sfx('door');
          }
        }
      }
      let isNew = false;
      if (step.clue) isNew = st.addClue(step.clue, p.id);
      G.audio.sfx(isNew ? 'clue' : 'pickup');
      this.sparkleBurst((p.x + p.w / 2) * TS, (p.y + p.h / 2) * TS, isNew ? 14 : 6);
      this.out.push({ t: 'discover', who: step.who || a.id, text: step.text, clue: isNew ? step.clue : null, prop: p.id, by: a.id });
    }
    completeDoorWork(d, step, a) {
      this.st.setFlag('unlocked_' + d.id);

      this.sparkleBurst((d.x + 0.5) * TS, TS * 0.6, 8);

    }

    // ---------- coop
    isPushing(a, p) {

      if (a.ctrl === 'remote') return !a.hidden && !!a.pushing && G.rectDist(a.x, a.y - 4, p.x * TS, p.y * TS, p.w * TS, p.h * TS) < 60;
      const inp = G.input.p[a.ctrl === 'p1' ? 1 : 0];
      return inp.actionDown && G.rectDist(a.x, a.y - 4, p.x * TS, p.y * TS, p.w * TS, p.h * TS) < 46;
    }
    updateCoop(dt) {
      const cw = this.coopWork;
      if (!cw) return;
      const n = this.players.filter((a) => this.isPushing(a, cw.p)).length;
      this.players.forEach((a) => { if (a.ctrl === 'remote') return; a.pushing = this.isPushing(a, cw.p); });
      this.players.forEach((a) => { if (a.ctrl === 'remote' && (a.hidden || !this.isPushing(a, cw.p))) a.rPush = false; else if (a.ctrl === 'remote') a.rPush = true; });
      if (n >= 2) {
        cw.t += dt; cw.idle = 0;
        if (Math.random() < dt * 8) this.sparkleBurst((cw.p.x + 0.5) * TS + (Math.random() - 0.5) * 30, (cw.p.y + 1) * TS, 1, true);
      } else {
        cw.idle += dt;
        if (n === 1 && !cw.warned && cw.idle > 0.9) {
          cw.warned = true;
          const a = this.players.find((q) => this.isPushing(q, cw.p));
          a && a.say(this.aiActive() ? '¡Aguanta! Mantén pulsado el botón mientras empujamos.' : '¡Necesita otro empujón! Mantened el botón los dos a la vez.', 3);
        }
        if (n === 0 && cw.idle > 0.6) this.coopWork = null;
      }
      if (cw && cw.t >= cw.dur) {
        const p = cw.p, step = cw.step;
        this.coopWork = null;
        this.players.forEach((a) => { if (a.ctrl !== 'remote') a.pushing = false; });
        const who = this.players[this.mode !== 'coop' ? this.human : 0];
        if ((this.st.progress[p.key] || 0) === cw.idx) this.completeStep(p, step, who);
      }
    }

    // ---------- efectos
    puff(x, y) { for (let i = 0; i < 7; i++) this.fx.push({ t: 0, life: 0.6, x: x + (Math.random() - 0.5) * 24, y: y + (Math.random() - 0.5) * 14, vx: (Math.random() - 0.5) * 40, vy: -20 - Math.random() * 20, k: 'puff', r: 8 + Math.random() * 8 }); }
    sparkleBurst(x, y, n, small) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 40 + Math.random() * 70; this.fx.push({ t: 0, life: 0.7 + Math.random() * 0.4, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, k: 'spark', r: small ? 4 : 7 }); } }
    updateFx(dt) {
      for (let i = this.fx.length - 1; i >= 0; i--) {
        const f = this.fx[i];

        if (f.t >= f.life) this.fx.splice(i, 1);
      }
    }

    // ---------- cámara
    viewports() { return [{ x: 0, y: 0, w: G.VW, h: G.VH }]; }
    camTarget(vp, fx, fy) {
      const r = this.room;
      let x = fx - vp.w / 2, y = fy - vp.h / 2;
      x = r.pw <= vp.w ? -(vp.w - r.pw) / 2 : G.clamp(x, 0, r.pw - vp.w);

    }
    focusPoint() {
      const p = this.players;
      if (this.mode !== 'coop') { const l = this.leader(); return { x: l.x, y: l.y - 20 }; }
      return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 - 20 };
    }
    snapCamera() {
      const f = this.focusPoint();
      const t = this.camTarget(this.viewports()[0], f.x, f.y);
      this.cam[0].x = t.x; this.cam[0].y = t.y;
      this.cam[1].x = t.x; this.cam[1].y = t.y;
    }
    updateCamera(dt) {
      const k = Math.min(1, dt * 6);
      const f = this.focusPoint();

      this.cam[0].x += (t.x - this.cam[0].x) * k; this.cam[0].y += (t.y - this.cam[0].y) * k;
      this.cam[1].x = this.cam[0].x; this.cam[1].y = this.cam[0].y;
    }

    // ---------- objetivo (flecha amistosa)
    roomRoute(from, to) {
      if (from === to) return null;
      const defs = this.st.def.rooms;
      const q = [[from, null]], seen = { [from]: true };
      while (q.length) {
        const [cur, first] = q.shift();
        for (const d of defs[cur].doors) {
          const nx = d.to.room;
          if (seen[nx]) continue;
          seen[nx] = true;
          const f = first || d;
          if (nx === to) return f;
          q.push([nx, f]);
        }
      }
      return null;
    }
    targetPos() {
      const t = this.target;
      if (!t) return null;
      const defs = this.st.def.rooms;
      if (t.kind === 'accuse') return null;
      let rm = t.room;
      if (t.kind === 'npc') { const pl = this.st.placementOf(t.id); rm = pl && pl.room; }
      if (!rm) return null;
      if (rm !== this.roomId) {
        const door = this.roomRoute(this.roomId, rm);
        return door ? { x: (door.x + 0.5) * TS, y: TS * 0.9 } : null;
      }
      if (t.kind === 'npc') { const n = this.npcs[t.id]; return n ? { x: n.x, y: n.y - 24 } : null; }
      const r = this.rooms[rm] || { props: [], doors: [] };
      const p = (r.props || []).find((q) => q.id === t.id);
      if (p) return { x: (p.x + p.w / 2) * TS, y: (p.y + p.h / 2) * TS };
      const d = (r.doors || []).find((q) => q.id === t.id);
      if (d) return { x: (d.x + 0.5) * TS, y: TS * 0.9 };
      return null;
    }
    refreshTarget(dt) {
      this.targetT -= dt;
      if (this.targetT <= 0) { this.targetT = 0.8; this.target = this.st.nextAction(); }
    }

    // ---------- actualización
    update(dt, enabled) {
      this.time += dt;
      const st = this.st;
      this.updateFx(dt);
      this.refreshTarget(dt);
      // burbujas
      this.players.concat(this.npcsHere()).forEach((a) => { if (a.bubble) { a.bubble.t -= dt; if (a.bubble.t <= 0) a.bubble = null; } });
      if (!enabled) { this.players.forEach((a) => { a.moving = false; }); return; }

      const speed = G.stats().speed * 2.6;
      // jugadores humanos
      this.players.forEach((a) => {
        if (a.ctrl === 'ai' || a.ctrl === 'remote') return;
        const inp = G.input.p[a.ctrl === 'p1' ? 1 : 0];
        let mx = inp.mx, my = inp.my;
        if (a.work) {
          const w = a.work;
          const moved = Math.hypot(mx, my) > 0.2;
          if (moved && w.dur > 0.6 && !(w.kind === 'prop' && w.target.stay)) {
            a.work = null;
            a.say('¡Me he movido!', 1.2);
            G.audio.sfx('back');
          } else {
            this.stepWork(a, dt);
          }
          a.moving = false;
        } else {
          const len = Math.hypot(mx, my);
          if (len > 0.05) {
            const sp = speed * a.speedMul;
            this.moveActor(a, mx * sp * dt, my * sp * dt);
            this.setFace(a, mx, my);
            a.moving = true;
            a.anim += dt;
          } else a.moving = false;
          if (inp.tool) this.cycleTool(a);
        }
        a.focus = a.work ? a.focus : this.findFocus(a);
        if (inp.action && !a.work) this.interact(a);
      });
      // IA del compañero
      this.updateCompanion && this.updateCompanion(dt);
      this.players.forEach((a) => { if (a.ctrl === 'ai' && a.work) this.stepWork(a, dt); });
      this.updateCoop(dt);
      this.updateNPCs(dt);
      this.updateCamera(dt);
      // linterna UV automática (visible)
      // sonido ambiente de la herramienta de grabar
    }
    stepWork(a, dt) {
      const w = a.work;
      if (!w) return;
      // vigilante (sigilo)
      if (w.watcher) {
        const n = this.npcs[w.watcher];
        const seen = n && n.watching;
        if (seen) {
          a.work = null;
          this.out.push({ t: 'spotted', who: a.id, npc: w.watcher });
          n.say('¡Eh! ¿Quién anda ahí?... ah, eras tú, Gertrudis.', 2.6);
          a.say('¡Nos ha visto casi!', 2);

          return;
        }
      }
      w.t += dt;
      w.tick += dt;
      if (w.tick > 0.22) { w.tick = 0; G.audio.sfx('work'); }
      if (w.t >= w.dur) {

        else this.completeDoorWork(w.target, w.step, a);
      }
    }
    updateNPCs(dt) {
      const st = this.st;
      const ps = this.players;
      this.npcsHere().forEach((n) => {
        // mirar al jugador más cercano si está cerca
        let near = null, nd = 1e9;
        ps.forEach((p) => { const d = G.dist(p.x, p.y, n.x, n.y); if (d < nd) { nd = d; near = p; } });
        if (n.cat) {
          n.anim += dt;
          if (n.wanderList && n.wanderList.length) {
            n.wanderT -= dt;
            if (!n.dest && n.wanderT <= 0) { n.dest = n.wanderList[Math.floor(Math.random() * n.wanderList.length)]; }
            if (n.dest) {
              const dx = n.dest.x - n.x, dy = n.dest.y - n.y, d = Math.hypot(dx, dy);
              if (d < 4) { n.dest = null; n.wanderT = 3 + Math.random() * 5; n.moving = false; }
              else { this.moveActor(n, (dx / d) * 52 * dt, (dy / d) * 52 * dt); this.setFace(n, dx, 0); n.moving = true; }
            }
          }
          if (nd < 70 && !n.bubble && Math.random() < dt * 0.15) { n.say('Miau', 1.5); G.audio.sfx('meow'); }
          return;
        }
        // vigilante: alterna mirar al frente / de espaldas
        if (n.id === 'baguette' && this.roomId === 'callejon' && st.chapter === 2) {
          const per = st.diff.id === 'hard' ? 6.0 : 6.5, look = st.diff.id === 'hard' ? 2.0 : 1.7; // la ventana segura (≥4 s) cubre la grabación de 3 s

        }
        if (nd < 90) this.faceToward(n, near.x, near.y);
      });
    }

    // ============================================================ DIBUJO
    draw(ctx, dt) {
      const vps = this.viewports();
      ctx.fillStyle = '#120a1c';
      ctx.fillRect(0, 0, G.VW, G.VH);
      vps.forEach((vp, i) => this.drawView(ctx, vp, this.cam[i], null, i));
    }
    actorSpriteName(a) {
      if (a.cat) return 'cat_' + (a.moving ? 'walk' : 'sit') + '_' + (Math.floor(a.anim * 6) % 2);
      const dir = a.face === 'up' ? 'up' : a.face === 'down' ? 'down' : 'side';
      const fr = a.moving ? Math.floor(a.anim * 7) % 2 : 0;
      return `${a.look}_${dir}_${fr}`;
    }
    drawActor(ctx, a) {
      const name = this.actorSpriteName(a);
      const s = G.spr[name];
      if (!s) return;
      G.drawSpr(ctx, 'shadow', a.x - 8 * S, a.y - 3 * S, { scale: S });
      const flip = a.face === 'left';
      const bob = a.moving ? Math.abs(Math.sin(a.anim * 14)) * 2 : 0;
      if (a.cat) G.drawSpr(ctx, name, a.x - 8 * S, a.y - 12 * S + 2, { scale: S, flip: a.face === 'left' });
      else G.drawSpr(ctx, name, a.x - 8 * S, a.y - 22 * S + 4 - bob, { scale: S, flip });
    }
    propSprite(p) {
      if (p.swap && this.st.flags[p.swap.flag]) return p.swap.sprite;
      if (p.id === 'paloma') return 'pigeon';
      return p.sprite;
    }
    drawProp(ctx, p, t) {
      const name = this.propSprite(p);
      if (!name) return;
      const s = G.spr[name];
      if (!s) return;
      const x = p.x * TS + ((p.w * TS - s.tw * S) / 2);
      const y = (p.y + p.h) * TS - s.th * S + (p.dy || 0) * S;
      let yy = y;
      if (p.pigeon) yy += Math.abs(Math.sin(t * 3 + p.t0)) * -2 + (Math.sin(t * 0.7 + p.t0) > 0.95 ? -6 : 0);
      G.drawSpr(ctx, name, x, yy, { scale: S });
    }
    shimmerOn(p, a) {
      const d = this.st.diff;
      if (d.sparkle === 'all') return true;
      if (this.hintIds[p.id]) return true;
      const sn = G.stats().sniff;
      if (sn && a) { const c = this.propCenter(p); if (G.dist(a.x, a.y, c.x, c.y) < sn * S * 1.2) return true; }
      return false;
    }
    drawView(ctx, vp, cam, only, vi) {
      const room = this.room, st = this.st, t = this.time;
      ctx.save();
      ctx.beginPath();
      ctx.rect(vp.x, vp.y, vp.w, vp.h);
      ctx.clip();
      ctx.fillStyle = '#120a1c';
      ctx.fillRect(vp.x, vp.y, vp.w, vp.h);
      ctx.save();
      ctx.translate(Math.round(vp.x - cam.x), Math.round(vp.y - cam.y));
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(room.static, 0, 0);
      // puertas
      room.doors.forEach((d) => {
        const state = this.doorState(d);
        let name = d.sprite;
        if (state !== 'open') name = d.lockedSprite || d.sprite;
        else {
          const near = this.players.some((p) => !p.hidden && G.rectDist(p.x, p.y, d.x * TS, 0, TS, TS) < 60);
          if (near && G.spr[d.sprite + '_open']) name = d.sprite + '_open';
        }
        G.drawSpr(ctx, name, d.x * TS, 0, { scale: S });
      });
      // objetos y personajes ordenados por profundidad
      const list = [];
      room.props.forEach((p) => {
        if (!this.propVisible(p) || p.uvOnly) return;
        list.push({ k: (p.y + p.h) * TS + (p.solid ? 0 : 2), o: p, type: 'p' });
      });
      this.players.forEach((a) => { if (!a.hidden) list.push({ k: a.y, o: a, type: 'a' }); });
      this.npcsHere().forEach((a) => list.push({ k: a.y, o: a, type: 'a' }));
      list.sort((a, b) => a.k - b.k);
      list.forEach((e) => (e.type === 'p' ? this.drawProp(ctx, e.o, t) : this.drawActor(ctx, e.o)));
      // brillos de pista
      room.props.forEach((p) => {
        const info = this.propStepInfo(p);
        if (!info || info.done || !p.shimmer) return;
        const a = only || this.leader();
        if (!this.shimmerOn(p, a)) return;
        const c = this.propCenter(p);
        if (p.uvOnly) { const k2 = 0.5 + 0.5 * Math.sin(t * 3 + p.t0); U().icon(ctx, 'ico_question', c.x - 14, c.y - 40 - k2 * 4, 28); return; }
        const k = 0.5 + 0.5 * Math.sin(t * 4 + p.t0);
        G.drawSpr(ctx, 'sparkle', c.x - 4 * S, c.y - 26 - k * 5, { scale: S * (0.7 + k * 0.5), alpha: 0.9 });
      });
      // partículas
      this.fx.forEach((f) => {
        const a = 1 - f.t / f.life;
        ctx.globalAlpha = a;
        if (f.k === 'spark') G.drawSpr(ctx, 'sparkle', f.x - 4 * S * 0.5, f.y - 4 * S * 0.5, { scale: S * 0.5 * (0.6 + a) });
        else { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.4 - a * 0.6), 0, 6.3); ctx.fill(); }
        ctx.globalAlpha = 1;
      });
      ctx.restore();

      // ---- luz UV
      const uvs = this.uvSources();
      if (uvs.length) this.drawUV(ctx, vp, cam, uvs);

      // ---- ambiente
      const amb = room.def.ambient;
      if (amb) { ctx.fillStyle = amb; ctx.fillRect(vp.x, vp.y, vp.w, vp.h); }
      this.drawVignette(ctx, vp);

      // ---- elementos de interfaz en el mundo
      const w2s = (x, y) => ({ x: vp.x + x - cam.x, y: vp.y + y - cam.y });
      // interrogantes sobre PNJ
      this.npcsHere().forEach((n) => {
        if (n.cat) return;
        const nd = st.def.npcs[n.id];
        const fresh = !st.flags['talked_' + n.id] || st.topicsFor(n.id).some((q) => !q.seen);
        if (fresh) {
          const s = w2s(n.x, n.y - 26 * S - 6 - Math.abs(Math.sin(t * 3 + n.x)) * 4);
          U().icon(ctx, st.flags['talked_' + n.id] ? 'ico_exclaim' : 'ico_question', s.x - 14, s.y - 10, 28);
        }
      });
      // burbujas
      this.players.concat(this.npcsHere()).forEach((a) => {
        if (!a.bubble || a.hidden) return;
        if (only && a !== only && !a.isNpc) return;
        const s = w2s(a.x, a.y - (a.cat ? 14 * S : 24 * S) - 8);
        U().bubble(ctx, a.bubble.text, s.x, s.y, { alpha: Math.min(1, a.bubble.t * 3) });
      });
      // anillos de progreso y avisos
      this.players.forEach((a) => {
        if (a.hidden) return;
        if (a.work) this.drawRing(ctx, w2s(a.x, a.y - 24 * S - 12), a.work.t / a.work.dur, a.work.tool ? G.TOOLS[a.work.tool].icon : 'ico_hand');
        if (this.coopWork && (a.ctrl === 'remote' ? a.rPush : a.pushing)) {
          const s = w2s(a.x, a.y - 24 * S - 12);
          this.drawRing(ctx, s, this.coopWork.t / this.coopWork.dur, 'ico_hand');
        }
      });
      // flecha objetivo

  // ------------------------------------------------------------ MODAL: secuencia de líneas / descubrimiento
  class LineSeq {

      this.t = 0;

    }
    setLine() {
      const l = this.lines[this.i];
      this.typer.set(l.text);

    }
    update(dt) {
      this.t += dt;
      this.typer.update(dt);
      const m = G.input.menu;
      if (m.ok || G.input.mouse.clicked) {
        if (!this.typer.done) this.typer.skip();

  // ------------------------------------------------------------ MODAL: cuaderno de detective
  class Notebook {
    constructor(scene, tab) {
      this.s = scene;
      this.st = scene.st;
      this.tab = tab || 0;
      this.sel = [0, 0, 0];
      this.acc = { culprit: null, method: null, motive: null, proof: [] };
      this.sub = 'slots';
      this.slots = null;
      this.chooser = null;
      this.confirm = null;
      this.t = 0;
      this.buildSlots();
    }
    tabsDef() { return ['Pistas', 'Sospechosos', 'Testimonios', 'Acusar']; }
    buildSlots() {
      const o = this.st.boardOptions(), sol = this.st.def.solution;
      const A = this.acc;
      const nameOf = (list, id) => { const f = list.find((x) => x.id === id); return f ? f.name || f.text : '—'; };
      const items = [];
      items.push({ k: 'culprit', label: '¿Quién fue?', right: A.culprit ? nameOf(this.st.def.suspects, A.culprit) : '—', icon: 'ico_question' });
      if (o.method) items.push({ k: 'method', label: '¿Cómo lo hizo?', right: A.method ? '✔' : '—', sub: A.method ? sol.methods.find((m) => m.id === A.method).text : 'Elige el método', icon: 'ico_lupa', h: 54 });
      if (o.motive) items.push({ k: 'motive', label: '¿Por qué?', right: A.motive ? '✔' : '—', sub: A.motive ? sol.motives.find((m) => m.id === A.motive).text : 'Elige el motivo', icon: 'ico_bulb', h: 54 });
      if (o.proof) items.push({ k: 'proof', label: 'Pruebas clave', right: A.proof.length + '/3', sub: 'Elige hasta 3 pistas que lo demuestren', icon: 'ico_clue', h: 54 });
      const ready = A.culprit && (!o.method || A.method) && (!o.motive || A.motive) && (!o.proof || A.proof.length >= 2);
      items.push({ k: 'go', label: '¡ACUSAR!', icon: 'ico_star', disabled: !ready, color: C.accent });
      const keep = this.slots ? this.slots.sel : 0;
      this.slots = new U.Menu(items, { x: 70, y: 168, w: 380, h: 44, gap: 8 });
      this.slots.sel = G.clamp(keep, 0, items.length - 1);
    }
    openChooser(k) {
      const st = this.st, sol = st.def.solution, o = st.boardOptions();
      const items = [];
      if (k === 'culprit') o.suspects.forEach((s) => items.push({ id: s.id, label: s.name, sub: s.desc, h: 52, right: st.diff.autoMark && st.suspectCleared(s.id) ? 'descartado' : '', rightColor: C.dim }));
      if (k === 'method') sol.methods.forEach((m) => items.push({ id: m.id, label: m.text, right: st.diff.autoMark && m.needs && m.needs.length ? (m.needs.every((c) => st.hasClue(c)) ? 'con pruebas' : 'sin pruebas') : '', rightColor: m.needs && m.needs.every((c) => st.hasClue(c)) ? C.good : C.dim }));
      if (k === 'motive') sol.motives.forEach((m) => items.push({ id: m.id, label: m.text, right: st.diff.autoMark && m.needs && m.needs.length ? (m.needs.every((c) => st.hasClue(c)) ? 'con pruebas' : 'sin pruebas') : '', rightColor: m.needs && m.needs.every((c) => st.hasClue(c)) ? C.good : C.dim }));
      if (k === 'proof') {
        st.clueOrder.forEach((c) => items.push({ id: c, label: st.def.clues[c].title, icon: st.def.clues[c].icon, right: this.acc.proof.indexOf(c) >= 0 ? '✔' : '', rightColor: C.good }));
        items.push({ id: '__done', label: 'Listo', icon: 'ico_arrow' });
      }
      this.chooser = { k, menu: new U.Menu(items.slice(0, 11), { x: 480, y: 136, w: 400, h: 40, gap: 5 }) };
      this.sub = 'choose';
    }
    update(dt) {
      this.t += dt;
      const m = G.input.menu, st = this.st;
      const mouse = G.input.mouse;
      if (this.sub === 'confirm') {
        const r = this.confirm.update();
        if (r.back) { this.sub = 'slots'; return; }
        if (r.chosen === 0) { this.s.onAccuse({ culprit: this.acc.culprit, method: this.acc.method, motive: this.acc.motive, proof: this.acc.proof }); return 'done'; }
        if (r.chosen === 1) this.sub = 'slots';
        return;
      }
      if (this.sub === 'choose') {
        const r = this.chooser.menu.update();
        if (r.back) { this.sub = 'slots'; return; }
        if (r.chosen >= 0) {
          const it = this.chooser.menu.items[r.chosen], k = this.chooser.k;
          if (k === 'proof') {
            if (it.id === '__done') { this.sub = 'slots'; this.buildSlots(); return; }
            const i = this.acc.proof.indexOf(it.id);
            if (i >= 0) this.acc.proof.splice(i, 1); else if (this.acc.proof.length < 3) this.acc.proof.push(it.id);
            it.right = this.acc.proof.indexOf(it.id) >= 0 ? '✔' : '';
          } else { this.acc[k] = it.id; this.sub = 'slots'; this.buildSlots(); }
        }
        return;
      }
      // pestañas
      const tabs = this.tabsDef();
      if (m.back) return 'done';
      if (this.tab !== 3) {
        if (m.left) { this.tab = (this.tab + tabs.length - 1) % tabs.length; G.audio.sfx('select'); }
        if (m.right) { this.tab = (this.tab + 1) % tabs.length; G.audio.sfx('select'); }
      } else if (this.sub === 'slots') {
        const r = this.slots.update();
        if (m.left) { this.tab = 2; G.audio.sfx('select'); }
        if (r.chosen >= 0) {
          const it = this.slots.items[r.chosen];
          if (it.k === 'go') { this.confirm = new U.Menu([{ label: 'Sí, ¡acusar!', icon: 'ico_star', color: C.accent }, { label: 'Seguir investigando', icon: 'ico_arrow' }], { x: 490, y: 320, w: 340, h: 46, gap: 8 }); this.sub = 'confirm'; }
          else this.openChooser(it.k);
        }
      }
      if (mouse.clicked) {
        const tw = 150;
        tabs.forEach((t, i) => { if (U.hit(70 + i * (tw + 8), 44, tw, 38)) { this.tab = i; G.audio.sfx('select'); this.sub = 'slots'; } });
        if (U.hit(G.VW - 100, 44, 56, 38)) return 'done';
      }
      // listas
      if (this.tab === 0) {
        const n = st.clueOrder.length;
        if (n) {
          if (m.up) this.sel[0] = (this.sel[0] + n - 1) % n;
          if (m.down) this.sel[0] = (this.sel[0] + 1) % n;
          if (mouse.clicked) for (let i = 0; i < Math.min(8, n); i++) { const base = Math.max(0, Math.min(this.sel[0] - 3, n - 8)); if (U.hit(70, 104 + i * 46, 330, 42)) this.sel[0] = base + i; }
        }
      }
      if (this.tab === 1) { const n = st.boardOptions().suspects.length; if (m.up) this.sel[1] = (this.sel[1] + n - 1) % n; if (m.down) this.sel[1] = (this.sel[1] + 1) % n; }
      if (this.tab === 2) { const n = Math.max(1, this.testimonyNpcs().length); if (m.up) this.sel[2] = (this.sel[2] + n - 1) % n; if (m.down) this.sel[2] = (this.sel[2] + 1) % n; }
    }
    testimonyNpcs() {
      const st = this.st;
      return Object.keys(st.def.npcs).filter((id) => !st.def.npcs[id].cat && (st.testimony && st.testimony[id] && st.testimony[id].length));
    }
    lieRefuted(npcId) {
      const L = this.st.def.lies && this.st.def.lies[npcId];
      if (!L || !this.st.flags[L.flag]) return null;
      return L.refutedBy.some((c) => this.st.hasClue(c)) ? 'refuted' : 'open';
    }
    draw(ctx) {
      const st = this.st, def = st.def;
      ctx.fillStyle = 'rgba(12,6,22,0.72)';
      ctx.fillRect(0, 0, G.VW, G.VH);

      // anillas
      for (let i = 0; i < 9; i++) { ctx.fillStyle = '#8a8498'; ctx.fillRect(px + 20 + i * 92, py + 42, 10, 18); }
      const tabs = this.tabsDef();

        U.text(ctx, t, x + 75, (sel ? 40 : 46) + (sel ? 12 : 9), { size: 17, align: 'center', color: sel ? '#fff' : '#5d4a30', shadow: false });
      });

      if (this.tab === 0) this.drawClues(ctx, ink, body);

    }
    drawClues(ctx, ink, body) {
      const st = this.st, n = st.clueOrder.length;

      const base = Math.max(0, Math.min(this.sel[0] - 3, n - 8));
      for (let i = 0; i < Math.min(8, n); i++) {
        const idx = base + i, id = st.clueOrder[idx], cd = st.def.clues[id], sel = idx === this.sel[0];
        U.rrect(ctx, 70, 104 + i * 46, 330, 42, 8);

      body(n + ' pistas', 70, 478, { size: 13, color: '#8f7a55' });

        if (pts.length) body(pts.join('\n'), 430, 390, { size: 15, color: '#5f3b8e', bold: true });

      const st = this.st, list = st.boardOptions().suspects;

          U.meter(ctx, x + 12, y + 272, cw - 24, 14, G.clamp(v / 6, 0, 1), v > 0 ? '#d94a3f' : '#8a8498', 'rgba(143,92,51,0.2)');
          if (st.suspectCleared(s.id)) {
            ctx.save(); ctx.translate(x + cw / 2, y + 320); ctx.rotate(-0.15);
            ctx.strokeStyle = '#3d8446'; ctx.lineWidth = 4; ctx.strokeRect(-66, -18, 132, 36);

        const lr = this.lieRefuted(id);

      this.slots.draw(ctx);
      if (this.sub === 'choose') {

  // ------------------------------------------------------------ ESCENA PRINCIPAL
  class PlayScene {
    enter(args) {
      const def = G.CASES[args.caseId];
      this.def = def;
      this.args = args;
      const st = (this.st = new G.CaseState(def, args.diff));
      st.testimony = {};
      this.dir = new G.Director(st);
      this.online = args.mode === 'online';
      this.world = new G.World(st, { mode: args.mode, me: this.online ? args.me || 0 : 0 });
      this.modals = [];
      this.trans = null;
      this.hint = null;
      this.ended = false;
      this.unattended = 0;
      G.input.mode = args.mode;
      if (args.resume) {
        st.restore(args.resume.snap);
        const w = this.world;
        w.rooms = {};
        w.enterRoom(args.resume.room || def.start.room, null, true);
        const r = w.room, d = r.doors[0];
        w.players.forEach((p, i) => { p.x = (d.x + 0.5) * G.TS + (i ? 20 : -20); p.y = 2 * G.TS - 10; });
        w.placeNPCs(true);
        w.snapCamera();
        U.toast('Partida recuperada: capítulo ' + st.chapter, 3);
      } else {
        const ch = def.chapters[0];
        if (ch.intro) this.seq(ch.intro, null);
        if (!G.save.data.settings.seenHelp) this.modals.push(new Pause.Help(this));
        this.modals.push(new Card(this, def.title, 'CASO ' + def.level + ' · ' + def.client, 3));
        this.autosave();
      }
      this.world.arrowOn = st.diff.sparkle === 'all';
      G.audio.setMode(st.diff.id === 'hard' ? 'tense' : 'play');
      if (this.online) {
        this.lastR = null; this.sTimer = 0; this.netT = 0; this.lastCa = G.net.remote ? G.net.remote.ca : undefined; this.lostT = 0;
        this.hadPartner = true;
      }
    }
    // ---------- red (2 móviles)
    netTick(dt) {
      const N = G.net, w = this.world, st = this.st;
      const playing = N.partnerPlaying();
      this.lostT = playing ? 0 : this.lostT + dt;
      // el compañero se cae: la IA toma su lugar; vuelve: se lo devuelve
      if (!w.aiTakeover && this.lostT > 6) {
        w.aiTakeover = true;
        const ai = w.players[1 - w.human], lead = w.players[w.human];
        ai.ctrl = 'ai'; ai.hidden = false; ai.work = null; ai.task = null; ai.path = null; ai.pushing = false;
        ai.x = lead.x - 30; ai.y = lead.y; ai.toolIdx = ai.id === 'luna' ? 1 : 0;
        w.initCompanion && w.initCompanion();
        U.toast('Tu compañero se ha desconectado. La IA ocupa su lugar hasta que vuelva.', 4, { color: C.accent });
      } else if (w.aiTakeover && playing) {
        w.aiTakeover = false;
        const ai = w.players[1 - w.human];
        ai.ctrl = 'remote'; ai.task = null; ai.path = null; ai.work = null; ai.autoUV = false; ai._wasHidden = true;
        U.toast('¡Tu compañero ha vuelto!', 3, { color: C.good });
        G.audio.sfx('success');
      }
      if (!w.aiTakeover) N.applyPose(w, dt);
      this.netT -= dt;
      if (this.netT <= 0) { this.netT = 0.07; N.patch(N.packPose(w)); }
      this.sTimer -= dt;
      if (this.sTimer <= 0) { this.sTimer = 0.5; N.patch(N.packState(st)); }
      const r = N.remote;
      if (r && r !== this.lastR) {
        this.lastR = r;
        const n0 = st.clueOrder.length;
        if (N.mergeState(st, w, r)) {
          st.clueOrder.slice(n0).forEach((id) => U.toast('Tu compañero ha encontrado: ' + st.def.clues[id].title, 3.2, { icon: st.def.clues[id].icon }));
          if (st.clueOrder.length > n0) { G.audio.sfx('clue'); this.dir.bump(); }
          let guard = 0;
          while (st.checkAdvance() && guard++ < 5);
          this.processCaseEvents();
        }
        if (r.ca !== undefined && r.ca !== this.lastCa) {
          this.lastCa = r.ca;
          U.toast((w.players[1 - w.human].id === 'rex' ? 'Rex' : 'Luna') + ' te necesita: ' + (r.cn || 'ayuda') + (r.ct === 'coop' ? ' (empujad a la vez)' : ''), 4.2, { color: C.accent });
          G.audio.sfx('hint');
        }
        if (r.fin && !this.ended) this.finish(r.fin === 1, r.fin === 1 ? '' : 'Vuestro compañero se ha quedado sin intentos.');
      }
    }
    // ---------- utilidades
    seq(lines, cb, o) { const m = new LineSeq(this, lines, o); m.onClose = cb; this.modals.push(m); }
    pushDiscovery(d, cb) {
      const cd = d.clue ? this.st.def.clues[d.clue] : null;
      const m = new LineSeq(this, [{ who: d.who, text: d.text }], { header: cd ? '¡PISTA ENCONTRADA! ' + cd.title : null, icon: cd ? cd.icon : null, skippable: false });
      m.onClose = cb;
      this.modals.push(m);
    }
    autosave() {
      const sv = G.save.data;
      sv.run = { caseId: this.def.id, diff: this.st.diffId, mode: this.args.mode, room: this.world.roomId, snap: this.st.snapshot() };
      G.save.store();
    }
    exitToHub(finished) {
      if (!finished) this.autosave();
      else { G.save.data.run = null; G.save.store(); }
      G.audio.setMode('office');
      if (this.online) { G.net.leave(); }
      G.go(G.scenes.hub, { from: 'play' });
    }
    // ---------- pistas
    showHint(h, manual) {
      const st = this.st, w = this.world;
      let text, tier = h.tier;
      if (!h.action) text = '¡Creo que ya lo tenéis todo! Abrid el cuaderno y acusad al culpable.';
      else text = tier === 1 ? h.action.text1 : h.action.text2;
      this.hint = { text, t: 9 };
      if (h.action && tier >= 2 && h.action.id) { w.hintIds[h.action.id] = true; }
      if (tier >= 3) w.arrowOn = true;
      w.aiHint && w.aiHint(text);
      G.audio.sfx('hint');
      if (manual && st.diff.hintCost && !h.free) U.toast('Pista pedida: +' + st.diff.hintCost + ' s de penalización', 2.6, { color: C.bad });
      if (manual && h.free) U.toast('Pista gratis del cuaderno de bolsillo', 2.4, { color: C.good });
    }
    // ---------- acusación
    onAccuse(sel) {
      const st = this.st, def = this.def;
      const res = st.accuse(sel);
      const client = def.clientId || 'hogaza';
      if (res.ok) {
        G.audio.sfx('fanfare');
        this.finish(true);
        return;
      }
      G.audio.sfx('error');
      const lines = [];
      if (st.diff.id === 'easy') {
        if (!res.culpritOk) lines.push({ who: client, text: 'Mmm... no creo que esa persona haya sido. Revisad las pruebas de vuestro cuaderno.' });
        else lines.push({ who: client, text: '¡El culpable es ese, sí! Pero el cómo o el porqué no cuadran del todo.' });
      } else if (st.diff.id === 'normal') {
        lines.push({ who: client, text: res.culpritOk ? 'Puede que sea esa persona... pero vuestra historia hace aguas. Falta algo.' : 'No me convence nada vuestra teoría. ¡Seguid investigando!' });
      } else {
        lines.push({ who: client, text: 'Eso no se sostiene. ' + (res.strikesLeft !== null ? (res.strikesLeft > 0 ? `Os queda ${res.strikesLeft} intento.` : 'No os quedan intentos.') : '') });
      }
      if (st.diff.wrongTime) { U.toast('Acusación fallida: +' + st.diff.wrongTime + ' s de penalización', 3, { color: C.bad }); }
      if (res.failed) {
        this.seq(lines, () => this.seq(def.epilogue.fail, () => this.finish(false, 'Os habéis quedado sin intentos.')));
      } else this.seq(lines, null);
    }
    finish(ok, msg) {
      if (this.ended) return;
      this.ended = true;
      const st = this.st, def = this.def;
      const r = st.reward();
      const sv = G.save.data;
      sv.money += r.money;
      sv.rep += r.rep;
      if (ok) {
        const rec = (sv.done[def.id] = sv.done[def.id] || { stars: {}, count: 0 });
        rec.count++;
        rec.stars[st.diffId] = Math.max(rec.stars[st.diffId] || 0, r.stars);
      }
      sv.run = null;
      G.save.store();
      if (this.online) G.net.patch({ fin: ok ? 1 : 2 });
      const show = () => this.modals.push(new Result(this, r, ok, msg));
      if (ok) this.seq(def.epilogue.win, show); else show();
    }
    // ---------- eventos del caso
    processCaseEvents() {
      const st = this.st, def = this.def;
      const evs = st.events.splice(0);
      evs.forEach((ev) => {
        if (ev.type === 'chapter') this.onChapter(ev.from, ev.to);
      });
    }
    onChapter(from, to) {
      const def = this.def, st = this.st;
      const outro = def.chapters[from - 1].outro, intro = def.chapters[to - 1].intro;
      const nxt = def.chapters[to - 1];
      // se apilan en orden inverso (el último en entrar se muestra primero)
      const queue = [];
      if (outro) queue.push(() => this.seq(outro, null));
      queue.push(() => { this.modals.push(new Card(this, nxt.title, 'CAPÍTULO ' + to, 2.4)); });
      if (intro) queue.push(() => this.seq(intro, null));
      for (let i = queue.length - 1; i >= 0; i--) queue[i]();
      this.world.onChapter();
      this.dir.bump();
      this.world.arrowOn = st.diff.sparkle === 'all';
      this.autosave();
      G.audio.sfx('success');
    }
    // ---------- bucle
    update(dt) {
      dt = Math.min(dt, 0.05);
      this.lastDt = dt;
      const st = this.st, w = this.world;
      G.audio.setMode(this.modals.length && this.modals[this.modals.length - 1] instanceof Result ? 'office' : st.diff.id === 'hard' || (st.timeLimit() && st.timeLeft() < 120) ? 'tense' : 'play');
      if (this.online) this.netTick(dt);
      this.asT = (this.asT || 0) + dt;
      if (this.asT > 30 && !this.ended) { this.asT = 0; this.autosave(); }
      G.input.touch.playing = !this.modals.length && !this.trans && !this.ended;
      if (this.trans) { this.updateTrans(dt); return; }
      const top = this.modals[this.modals.length - 1];
      if (top) {
        const r = top.update(dt);
        if (r === 'done') {
          const idx = this.modals.indexOf(top);
          if (idx >= 0) this.modals.splice(idx, 1);
          top.onClose && top.onClose();
          st.checkAdvance();
        }
        return;
      }
      this.updateFree(dt);
    }
    updateFree(dt) {
      const st = this.st, w = this.world, I = G.input;
      if (I.p[0].pause) { this.modals.push(new Pause(this)); return; }
      if (I.p[0].book || (this.args.mode === 'coop' && I.p[1].book)) { this.modals.push(new Notebook(this, 0)); G.audio.sfx('ok'); return; }
      if (I.hint) { this.showHint(this.dir.request(), true); }
      if (I.p[0].swap && this.args.mode === 'solo') w.swapSolo();
      if (I.mouse.clicked) {
        if (U.hit(G.VW - 150, G.VH - 52, 140, 42)) { this.modals.push(new Notebook(this, 0)); G.audio.sfx('ok'); return; }
        if (U.hit(G.VW / 2 - 70, G.VH - 52, 140, 42)) { this.showHint(this.dir.request(), true); }
        if (U.hit(G.VW - 54, 8, 44, 44)) { this.modals.push(new Pause(this)); return; }
      }
      st.time += dt;
      w.update(dt, true);
      this.world.arrowOn = st.diff.sparkle === 'all' || (this.dir.tier >= 3);
      // eventos del mundo
      w.out.splice(0).forEach((ev) => this.handleWorldEvent(ev));
      this.processCaseEvents();
      const h = this.dir.update(dt, true);
      if (h) this.showHint(h, false);
      if (this.hint) { this.hint.t -= dt; if (this.hint.t <= 0) this.hint = null; }
      // tiempo límite
      if (st.timeLimit() && st.timeLeft() <= 0 && !this.ended) {
        this.seq([{ who: this.def.clientId || 'hogaza', text: '¡Se acabó el tiempo! El concurso ha empezado sin vosotros...' }], () => this.finish(false, 'Se acabó el tiempo.'));
      }
    }
    handleWorldEvent(ev) {
      const st = this.st, w = this.world;
      if (ev.t === 'discover') {
        w.lastDiscover = ev.clue;
        this.dir.bump();
        this.pushDiscovery(ev, null);
      } else if (ev.t === 'talk') {
        this.modals.push(new Talk(this, ev.npc));
        this.dir.bump();
      } else if (ev.t === 'door') {
        const d = ev.door;
        if (d.firstOpen && !st.hasClue(d.firstOpen.clue)) {
          st.addClue(d.firstOpen.clue, 'door');
          this.pushDiscovery({ who: d.firstOpen.who, text: d.firstOpen.text, clue: d.firstOpen.clue }, () => this.startTrans(d));
        } else this.startTrans(d);
      } else if (ev.t === 'call') {
        G.net.patch({ ca: (G.net._ca = (G.net._ca || 0) + 1), cn: ev.label, ct: ev.tool });
      } else if (ev.t === 'denied') {
        const a = w.players.find((p) => p.id === ev.who) || w.leader();
        a.say(ev.text, 4);
        this.dir.denied();
      } else if (ev.t === 'toast') U.toast(ev.text, 2.6, { icon: ev.icon });
      else if (ev.t === 'spotted') { this.dir.denied(); U.toast('¡Casi te ven! Espera a que mire hacia otro lado.', 3, { color: C.bad }); }
      else if (ev.t === 'denied_soft') this.dir.denied();
      else if (ev.t === 'room_first') { /* hueco para futuros comentarios */ }
    }
    startTrans(d) { this.trans = { phase: 'out', t: 0, door: d }; G.audio.sfx('door'); }
    updateTrans(dt) {
      const T = this.trans;
      T.t += dt;
      if (T.phase === 'out' && T.t >= 0.28) {
        T.phase = 'in'; T.t = 0;
        this.world.enterRoom(T.door.to.room, T.door.to.door);
        this.world.out.length = 0;
      } else if (T.phase === 'in' && T.t >= 0.28) this.trans = null;
      this.world.update(dt, false);
    }

    // ---------- dibujo
    drawTouch(ctx) {
      const T = G.input.touch;
      if (!T.enabled || !T.playing) return;
      const w = this.world, me = w.players[w.human], f = me.focus;
      const circle = (b, down, fill) => {
        ctx.save();
        ctx.globalAlpha = down ? 0.95 : 0.7;
        ctx.fillStyle = fill; ctx.strokeStyle = '#ffd45a'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.3); ctx.fill(); ctx.stroke();
        ctx.restore();
      };
      const busy = !!me.work;
      circle(T.A, T.A.id !== null, f && !busy ? 'rgba(255,212,90,0.45)' : 'rgba(40,26,64,0.7)');
      if (f && !busy) U.icon(ctx, f.icon, T.A.x - 20, T.A.y - 30, 40);
      U.text(ctx, 'ACCIÓN', T.A.x, T.A.y + 14, { size: 14, align: 'center' });
      circle(T.T, T.T.id !== null, 'rgba(40,26,64,0.7)');
      const tl = me.tool;
      if (tl) U.icon(ctx, G.TOOLS[tl].icon, T.T.x - 18, T.T.y - 26, 36);
      U.text(ctx, 'Cambiar', T.T.x, T.T.y + 12, { size: 11, align: 'center' });
      const S2 = T.stick;
      if (S2.id !== null) {
        ctx.save();
        ctx.globalAlpha = 0.5; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(S2.ox, S2.oy, 58, 0, 6.3); ctx.stroke();
        ctx.globalAlpha = 0.8; ctx.fillStyle = '#ffd45a';
        ctx.beginPath(); ctx.arc(S2.x, S2.y, 26, 0, 6.3); ctx.fill();
        ctx.restore();
      } else U.text(ctx, 'Arrastra aquí para moverte', 150, G.VH - 130, { size: 13, align: 'center', color: C.dim, bold: false });
    }
    draw(ctx) {
      const st = this.st, w = this.world;
      w.draw(ctx, 0);
      this.drawHUD(ctx);
      if (this.trans) {
        const a = this.trans.phase === 'out' ? this.trans.t / 0.28 : 1 - this.trans.t / 0.28;
        ctx.fillStyle = `rgba(10,5,20,${G.clamp(a, 0, 1)})`;
        ctx.fillRect(0, 0, G.VW, G.VH);
      }
      const top = this.modals[this.modals.length - 1];
      if (top) {
        if (top instanceof LineSeq || top instanceof Talk) { ctx.fillStyle = 'rgba(12,6,22,0.28)'; ctx.fillRect(0, 0, G.VW, G.VH); }
        top.draw(ctx);
      }
      U.drawToasts(ctx, this.lastDt || 0.016);
    }
    drawHUD(ctx) {
      const st = this.st, w = this.world, def = this.def;
      const showHud = !(this.modals.length && this.modals[this.modals.length - 1] instanceof Card);
      if (!showHud) return;
      // objetivos
      const ch = st.chapterDef();
      const goals = st.goals();
      let h = 40;
      ctx.font = U.font(14);
      const wrapped = goals.map((g) => G.wrap(ctx, g.text + (g.prog[1] > 1 ? ` (${g.prog[0]}/${g.prog[1]})` : ''), 270));
      wrapped.forEach((l) => (h += l.length * 18 + 5));
      U.panel(ctx, 10, 10, 312, h + 6, { fill: 'rgba(24,14,40,0.82)', shadow: false });
      U.text(ctx, 'Cap. ' + ch.id + ' · ' + ch.title, 22, 18, { size: 15, color: C.accent, maxW: 290 });
      let y = 44;
      goals.forEach((g, i) => {
        ctx.fillStyle = g.done ? '#7de38a' : 'rgba(255,255,255,0.18)';
        ctx.beginPath(); ctx.arc(30, y + 8, 7, 0, 6.3); ctx.fill();
        if (g.done) U.text(ctx, '✔', 30, y + 1, { size: 11, align: 'center', color: '#1a3a22', shadow: false });
        wrapped[i].forEach((ln, k) => U.text(ctx, ln, 46, y + k * 18, { size: 14, color: g.done ? '#8ec99a' : C.text, bold: false }));
        y += wrapped[i].length * 18 + 5;
      });
      // dinero / tiempo / pistas
      const lim = st.timeLimit();
      const tl = lim ? st.timeLeft() : st.elapsed();
      const ix = 650;
      U.panel(ctx, ix, 10, 246, 44, { fill: 'rgba(24,14,40,0.82)', shadow: false });
      U.icon(ctx, 'ico_coin', ix + 8, 18, 28);
      U.text(ctx, String(G.save.data.money), ix + 40, 20, { size: 17, color: C.accent });
      U.icon(ctx, 'ico_clue', ix + 100, 18, 28);
      U.text(ctx, String(st.clueCount()), ix + 132, 20, { size: 17 });
      U.text(ctx, (lim ? '⏱ ' : '') + G.fmtTime(tl), ix + 236, 20, { size: 17, align: 'right', color: lim && tl < 120 ? C.bad : C.text });
      if (st.diff.strikes < 90) for (let i = 0; i < st.diff.strikes; i++) U.icon(ctx, 'ico_heart', ix + 214 - i * 26, 58, 24);
      // pausa
      U.panel(ctx, G.VW - 54, 8, 44, 44, { fill: 'rgba(24,14,40,0.82)', shadow: false });
      U.text(ctx, 'II', G.VW - 32, 17, { size: 22, align: 'center' });
      // herramientas
      const toolPanel = (a, x, ctrlLabel, isAI) => {
        const bw = 258;
        U.panel(ctx, x, G.VH - 78, bw, 68, { fill: 'rgba(24,14,40,0.86)', shadow: false, stroke: a.id === 'rex' ? '#c9a063' : '#3fb5b0' });
        U.portrait(ctx, a.look, x + 8, G.VH - 70, 52);
        U.text(ctx, G.ROLES[a.id].name + (isAI ? ' (IA)' : ''), x + 68, G.VH - 72, { size: 14, color: G.ROLES[a.id].color });
        a.tools.forEach((t, i) => {
          const tx = x + 68 + i * 90, sel = a.toolIdx === i;
          U.rrect(ctx, tx, G.VH - 54, 84, 36, 8);
          ctx.fillStyle = sel ? 'rgba(255,212,90,0.25)' : 'rgba(255,255,255,0.07)'; ctx.fill();
          ctx.lineWidth = sel ? 2.5 : 1; ctx.strokeStyle = sel ? C.accent : '#6b4f9a'; ctx.stroke();
          U.icon(ctx, G.TOOLS[t].icon, tx + 4, G.VH - 52, 30);
          U.text(ctx, G.TOOLS[t].name.split(' ')[0], tx + 38, G.VH - 44, { size: 11, color: sel ? C.accent : C.dim });
        });
      };
      if (this.args.mode === 'coop') {
        toolPanel(w.players[0], 10, '', false);
        toolPanel(w.players[1], 276, '', false);
      } else if (this.online) {
        toolPanel(w.leader(), 10, '', false);
        const q = w.players[1 - w.human], ok = G.net.partnerPlaying();
        U.panel(ctx, 276, G.VH - 78, 200, 68, { fill: 'rgba(24,14,40,0.86)', shadow: false, stroke: ok ? '#4fd08a' : '#ff7a6b' });
        U.portrait(ctx, q.look, 284, G.VH - 70, 52);
        U.text(ctx, G.ROLES[q.id].name, 344, G.VH - 72, { size: 14, color: G.ROLES[q.id].color });
        U.text(ctx, ok ? (q.hidden ? 'en otra sala' : 'conectado') : w.aiTakeover ? 'IA al mando' : 'sin conexión', 344, G.VH - 50, { size: 13, color: ok ? C.good : C.bad, bold: false });
        U.text(ctx, 'Sala ' + G.net.code, 344, G.VH - 32, { size: 12, color: C.dim, bold: false });
      } else {
        toolPanel(w.leader(), 10, '', false);
        toolPanel(w.players[1 - w.human], 276, '', true);
      }
      this.drawTouch(ctx);
      if (this.online && this.lostT > 3 && !w.aiTakeover) {
        U.panel(ctx, G.VW / 2 - 230, 74, 460, 40, { fill: 'rgba(80,20,30,0.94)', stroke: C.bad, shadow: false });
        U.text(ctx, 'Conexión con tu compañero perdida. Si no vuelve, la IA ocupa su lugar…', G.VW / 2, 84, { size: 16, align: 'center' });
      }
      // botones centrales
      const hx = G.VW - 326;
      U.panel(ctx, G.VW - 150, G.VH - 52, 140, 42, { fill: U.hit(G.VW - 150, G.VH - 52, 140, 42) ? '#6a47b8' : 'rgba(24,14,40,0.88)', shadow: false, stroke: C.accent, r: 10 });
      U.icon(ctx, 'ico_book', G.VW - 144, G.VH - 47, 32);
      U.text(ctx, 'Cuaderno', G.VW - 106, G.VH - 41, { size: 15 });
      if (!G.input.touch.enabled) U.text(ctx, 'F', G.VW - 20, G.VH - 41, { size: 12, align: 'right', color: C.dim });
      U.panel(ctx, hx + 20, G.VH - 52, 140, 42, { fill: U.hit(hx + 20, G.VH - 52, 140, 42) ? '#6a47b8' : 'rgba(24,14,40,0.88)', shadow: false, stroke: '#6b4f9a', r: 10 });
      U.icon(ctx, 'ico_bulb', hx + 24, G.VH - 47, 32);
      U.text(ctx, G.input.touch.enabled ? 'Pista' : 'Pista (H)', hx + 62, G.VH - 41, { size: 15 });
      if (this.args.mode === 'solo' && !G.input.touch.enabled) U.text(ctx, 'Tab: cambiar de detective', G.VW - 20, G.VH - 80, { size: 12, align: 'right', color: C.dim, bold: false });
      // consejo
      if (this.hint) {
        const hw = 560, hy = G.VH - 160;
        U.panel(ctx, (G.VW - hw) / 2, hy, hw, 66, { fill: 'rgba(40,26,64,0.95)', stroke: C.accent, shadow: false });
        U.icon(ctx, 'ico_bulb', (G.VW - hw) / 2 + 12, hy + 14, 38);
        U.text(ctx, this.hint.text, (G.VW - hw) / 2 + 62, hy + 10, { size: 16, maxW: hw - 80, lineH: 22 });
      }
    }
  }

  // ------------------------------------------------------------ AYUDA DE CONTROLES (también en el despacho)
  G.drawHelp = function (ctx, mode) {
