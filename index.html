  // ------------------------------------------------------------ ESCENA PRINCIPAL
  class PlayScene {
    enter(args) {
      const def = G.CASES[args.caseId];
      this.def = def;
      this.args = args;
      const st = (this.st = new G.CaseState(def, args.diff));
      st.testimony = {};
      this.dir = new G.Director(st);
      this.online = args.mode === 'online';
      this.world = new G.World(st, { mode: args.mode, me: this.online ? args.me || 0 : 0 });
      this.modals = [];
      this.trans = null;
      this.hint = null;
      this.ended = false;
      this.unattended = 0;
      G.input.mode = args.mode;
      if (args.resume) {
        st.restore(args.resume.snap);
        const w = this.world;
        w.rooms = {};
        w.enterRoom(args.resume.room || def.start.room, null, true);
        const r = w.room, d = r.doors[0];
        w.players.forEach((p, i) => { const sp = G.doorSpawn(d, i); p.x = sp.x; p.y = sp.y; });
        w.placeNPCs(true);
        w.snapCamera();
        U.toast('Partida recuperada: capítulo ' + st.chapter, 3);
      } else {
        const ch = def.chapters[0];
        if (ch.intro) this.seq(ch.intro, null);
        if (!G.save.data.settings.seenHelp) this.modals.push(new Pause.Help(this));
        this.modals.push(new Card(this, def.title, 'CASO ' + def.level + ' · ' + def.client, 3));
        this.autosave();
      }
      this.world.arrowOn = st.diff.sparkle === 'all';
      G.audio.setMode(st.diff.id === 'hard' ? 'tense' : 'play');
      if (this.online) {
        this.lastR = null; this.sTimer = 0; this.netT = 0; this.lastCa = G.net.remote ? G.net.remote.ca : undefined; this.lostT = 0;
        this.hadPartner = true;
      }
    }
    // ---------- red (2 móviles)
    netTick(dt) {
      const N = G.net, w = this.world, st = this.st;
      const playing = N.partnerPlaying();
      this.lostT = playing ? 0 : this.lostT + dt;
      // el compañero se cae: la IA toma su lugar; vuelve: se lo devuelve
      if (!w.aiTakeover && this.lostT > 6) {
        w.aiTakeover = true;
        const ai = w.players[1 - w.human], lead = w.players[w.human];
        ai.ctrl = 'ai'; ai.hidden = false; ai.work = null; ai.task = null; ai.path = null; ai.pushing = false;
        ai.x = lead.x - 30; ai.y = lead.y; ai.toolIdx = G.startToolOf(ai.id, w.st.def);
        w.initCompanion && w.initCompanion();
        U.toast('Tu compañero se ha desconectado. La IA ocupa su lugar hasta que vuelva.', 4, { color: C.accent });
      } else if (w.aiTakeover && playing) {
        w.aiTakeover = false;
        const ai = w.players[1 - w.human];
        ai.ctrl = 'remote'; ai.task = null; ai.path = null; ai.work = null; ai.autoUV = false; ai._wasHidden = true;
        U.toast('¡Tu compañero ha vuelto!', 3, { color: C.good });
        G.audio.sfx('success');
      }
      if (!w.aiTakeover) N.applyPose(w, dt);
      this.netT -= dt;
      if (this.netT <= 0) { this.netT = 0.07; N.patch(N.packPose(w)); }
      this.sTimer -= dt;
      if (this.sTimer <= 0) { this.sTimer = 0.5; N.patch(N.packState(st)); }
      const r = N.remote;
      if (r && r !== this.lastR) {
        this.lastR = r;
        const n0 = st.clueOrder.length;
        if (N.mergeState(st, w, r)) {
          st.clueOrder.slice(n0).forEach((id) => U.toast('Tu compañero ha encontrado: ' + st.def.clues[id].title, 3.2, { icon: st.def.clues[id].icon }));
          if (st.clueOrder.length > n0) { G.audio.sfx('clue'); this.dir.bump(); }
          let guard = 0;
          while (st.checkAdvance() && guard++ < 5);
          this.processCaseEvents();
        }
        if (r.ca !== undefined && r.ca !== this.lastCa) {
          this.lastCa = r.ca;
          U.toast((w.players[1 - w.human].id === 'rex' ? 'Oli' : 'Lali') + ' te necesita: ' + (r.cn || 'ayuda') + (r.ct === 'coop' ? ' (empujad a la vez)' : ''), 4.2, { color: C.accent });
          G.audio.sfx('hint');
        }
        if (r.fin && !this.ended) this.finish(r.fin === 1, r.fin === 1 ? '' : 'Vuestro compañero se ha quedado sin intentos.');
      }
    }
    // ---------- utilidades
    seq(lines, cb, o) { const m = new LineSeq(this, lines, o); m.onClose = cb; this.modals.push(m); }
    pushDiscovery(d, cb) {
      const cd = d.clue ? this.st.def.clues[d.clue] : null;
      const m = new LineSeq(this, [{ who: d.who, text: d.text }], { header: cd ? '¡PISTA ENCONTRADA! ' + cd.title : null, icon: cd ? cd.icon : null, skippable: false });
      m.onClose = cb;
      this.modals.push(m);
    }
    autosave() {
      const sv = G.save.data;
      sv.run = { caseId: this.def.id, diff: this.st.diffId, mode: this.args.mode, room: this.world.roomId, snap: this.st.snapshot() };
      G.save.store();
    }
    exitToHub(finished) {
      if (!finished) this.autosave();
      else { G.save.data.run = null; G.save.store(); }
      G.audio.setMode('office');
      if (this.online) { G.net.leave(); }
      G.go(G.scenes.hub, { from: 'play' });
    }
    // ---------- pistas
    showHint(h, manual) {
      const st = this.st, w = this.world;
      let text, tier = h.tier;
      if (!h.action) text = '¡Creo que ya lo tenéis todo! Abrid el cuaderno y acusad al culpable.';
      else text = tier === 1 ? h.action.text1 : h.action.text2;
      this.hint = { text, t: 9 };
      if (h.action && tier >= 2 && h.action.id) { w.hintIds[h.action.id] = true; }
      if (tier >= 3) w.arrowOn = true;
      w.aiHint && w.aiHint(text);
      G.audio.sfx('hint');
      if (manual && st.diff.hintCost && !h.free) U.toast('Pista pedida: +' + st.diff.hintCost + ' s de penalización', 2.6, { color: C.bad });
      if (manual && h.free) U.toast('Pista gratis del cuaderno de bolsillo', 2.4, { color: C.good });
    }
    // ---------- acusación
    onAccuse(sel) {
      const st = this.st, def = this.def;
      const res = st.accuse(sel);
      const client = def.clientId;
      if (res.ok) {
        G.audio.sfx('fanfare');
        this.finish(true);
        return;
      }
      G.audio.sfx('error');
      const lines = [];
      if (st.diff.id === 'easy') {
        if (!res.culpritOk) lines.push({ who: client, text: 'Mmm... no creo que esa persona haya sido. Revisad las pruebas de vuestro cuaderno.' });
        else lines.push({ who: client, text: '¡El culpable es ese, sí! Pero el cómo o el porqué no cuadran del todo.' });
      } else if (st.diff.id === 'normal') {
        lines.push({ who: client, text: res.culpritOk ? 'Puede que sea esa persona... pero vuestra historia hace aguas. Falta algo.' : 'No me convence nada vuestra teoría. ¡Seguid investigando!' });
      } else {
        lines.push({ who: client, text: 'Eso no se sostiene. ' + (res.strikesLeft !== null ? (res.strikesLeft > 0 ? `Os queda ${res.strikesLeft} intento.` : 'No os quedan intentos.') : '') });
      }
      if (st.diff.wrongTime) { U.toast('Acusación fallida: +' + st.diff.wrongTime + ' s de penalización', 3, { color: C.bad }); }
      if (res.failed) {
        this.seq(lines, () => this.seq(def.epilogue.fail, () => this.finish(false, 'Os habéis quedado sin intentos.')));
      } else this.seq(lines, null);
    }
    finish(ok, msg) {
      if (this.ended) return;

        U.panel(ctx, 14, 410, 500, 100, { fill: 'rgba(24,14,40,0.92)', shadow: false });
        if (a) {
          U.text(ctx, a.name + (G.hasAch(a.id) ? '  ✔' : ''), 30, 418, { size: 18, color: G.hasAch(a.id) ? C.good : C.accent });
          U.text(ctx, a.desc, 30, 450, { size: 15, maxW: 470, bold: false });
        } else U.text(ctx, 'Los logros se desbloquean jugando casos.', 30, 430, { size: 15, bold: false });
      }
      if (this.state === 'shop') {
        const m = this.menu, it = m.items[m.sel];
        U.panel(ctx, 14, 410, 500, 100, { fill: 'rgba(24,14,40,0.92)', shadow: false });
        const u = it && G.UPGRADES.find((x) => x.id === it.id);
        if (u) {
          U.text(ctx, u.name + '  (nivel ' + G.upgLevel(u.id) + '/' + u.max + ')', 30, 414, { size: 18, color: C.accent });
          U.text(ctx, u.desc, 30, 444, { size: 15, maxW: 470, bold: false });
        } else U.text(ctx, 'Gana monedas resolviendo casos y mejora tu equipo.', 30, 420, { size: 15, bold: false });
      }
      if (this.toast) {
        this.toast.t -= 0.016;
        if (this.toast.t <= 0) this.toast = null;
        else U.text(ctx, this.toast.msg, 735, G.VH - 38, { size: 17, align: 'center', color: this.toast.col });
      }
    }
  }


  // ---------- SALA ONLINE (2 iPhones) ----------
  class Lobby {
    enter(args) {
      this.a = args;
      this.t = 0;
      this.msg = '';
      this.code = '';
      this.starting = false;
      this.setState('menu');
      G.net.avail = null;
      G.net.init().then((ok) => { G.net.avail = ok; if (!ok && this.state === 'menu') this.msg = 'Este visor no permite jugar online. Abre el enlace desde Claude con tu sesión iniciada.'; });
      G.net.onGo = (go) => {
        if (G.scene !== this || this.starting) return;
        if (G.net.versionMismatch()) { this.msg = G.net.versionMsg(); G.audio.sfx('error'); return; }
        { const gm = !G.CASES[go.c] && /^gen_g(\d+)_([0-9a-z]+)$/.exec(go.c); if (gm) { const sd = G.caseSeedFromCode('G' + gm[1] + '-' + gm[2]); if (sd.seed !== undefined) try { G.generateCase(sd.seed, { register: true }); } catch (e) {} } } // el invitado genera solo el caso de prueba que eligió el anfitrión (no hace falta cargar el código en los dos móviles)
        if (G.CASES[go.c]) { this.starting = true; const sv = G.save.data.run; G.go(G.scenes.play, { caseId: go.c, diff: go.d, mode: 'online', me: G.net.me, resume: go.r && sv && sv.caseId === go.c && sv.mode === 'online' ? sv : undefined }); }
      };
    }
    setState(s) {
      this.state = s;
      if (s === 'menu') this.menu = new U.Menu([
        { id: 'host', label: 'Crear sala', sub: 'Tú serás Oli y recibirás un código', icon: 'ico_star', h: 62 },
        { id: 'join', label: 'Unirme con código', sub: 'Tú serás Lali', icon: 'ico_key', h: 62 },
        { id: 'back', label: 'Volver', icon: 'ico_arrow' },
      ], { x: 300, y: 190, w: 360, h: 50, gap: 12 });
      if (s === 'host') this.menu = new U.Menu([
        { id: 'go', label: '¡Empezar el caso!', icon: 'ico_arrow', h: 56 },
        { id: 'back', label: 'Cancelar', icon: 'ico_arrow' },
      ], { x: 300, y: 400, w: 360, h: 50, gap: 10 });
      if (s === 'wait') this.menu = new U.Menu([{ id: 'back', label: 'Salir', icon: 'ico_arrow' }], { x: 300, y: 420, w: 360, h: 50, gap: 10 });
    }
    async open(code, me) {
      this.msg = 'Conectando…';
      try {
        await G.net.open(code, me);
        this.msg = '';
        this.setState(me === 0 ? 'host' : 'wait');
      } catch (e) {
        this.msg = G.net.error === 'unavailable' ? 'Este visor no permite jugar online. Abre el enlace desde Claude con tu sesión iniciada.' : G.net.errorText(G.net.error);
        this.setState('menu');
      }
    }
    keys() {
      const L = 'ABCDEFGHJKLMNPRSTUVXYZ'.split('');
      const out = L.map((c, i) => ({ c, x: 110 + (i % 8) * 92, y: 235 + Math.floor(i / 8) * 66, w: 82, h: 58 }));
      out.push({ c: '⌫', x: 110 + 6 * 92, y: 235 + 2 * 66, w: 82, h: 58, del: true });
      return out;
    }
    update(dt) {
      this.t += dt;
      const m = G.input.menu, N = G.net;
      if (this.state === 'join') {
        if (m.back) { this.setState('menu'); return; }
        if (G.input.mouse.clicked) {
          this.keys().forEach((k) => {
            if (!U.hit(k.x, k.y, k.w, k.h)) return;
            G.audio.sfx('select');
            if (k.del) this.code = this.code.slice(0, -1);
            else if (this.code.length < N.CODE_LEN) this.code += k.c;
          });
          if (U.hit(10, 10, 150, 46)) { this.setState('menu'); return; }
          if (this.code.length === N.CODE_LEN && !this.opening) { this.opening = true; this.open(this.code, 1).then(() => { this.opening = false; }); }
        }
        // teclado físico
        for (let c = 65; c <= 90; c++) { const ch = String.fromCharCode(c); if (G.input.keyPressed('Key' + ch) && this.code.length < N.CODE_LEN) this.code += ch; }
        if (G.input.keyPressed('Backspace')) this.code = this.code.slice(0, -1);
        if (this.code.length === N.CODE_LEN && !this.opening) { this.opening = true; this.open(this.code, 1).then(() => { this.opening = false; }); }
        return;
      }
      const r = this.menu.update();
      if (this.state === 'menu') {
        if (r.back || (r.chosen >= 0 && this.menu.items[r.chosen].id === 'back')) { G.net.leave(); G.go(G.scenes.hub, { from: 'lobby' }); return; }
        if (r.chosen >= 0) {
          const id = this.menu.items[r.chosen].id;
          if (id === 'host') this.open(N.genCode(), 0);
          if (id === 'join') { this.code = ''; this.opening = false; this.msg = ''; this.setState('join'); }
        }
      } else {
        if (r.back || (r.chosen >= 0 && this.menu.items[r.chosen].id === 'back')) { N.leave(); this.setState('menu'); return; }
        if (this.state === 'host' && r.chosen >= 0 && this.menu.items[r.chosen].id === 'go') {
          if (!N.remoteHere) { this.msg = 'Todavía no ha entrado nadie con el código.'; G.audio.sfx('error'); return; }
          if (N.versionMismatch()) { this.msg = N.versionMsg(); G.audio.sfx('error'); return; }
          this.starting = true;
          N.sendGo(this.a.caseId, this.a.diff, !!this.a.resume);
          G.go(G.scenes.play, { caseId: this.a.caseId, diff: this.a.diff, mode: 'online', me: N.me, resume: this.a.resume });
        }
      }
    }
    draw(ctx) {
      U.backdrop(ctx);
      const N = G.net;
      U.text(ctx, 'Sala online', G.VW / 2, 40, { size: 34, align: 'center', color: C.accent });
      if (this.state === 'menu') {
        U.text(ctx, 'Cada detective en su móvil. Hace falta conexión (datos o wifi).', G.VW / 2, 120, { size: 16, align: 'center', color: C.dim, bold: false });
        this.menu.draw(ctx);
      }
      const box = (code, y) => {
        const n = N.CODE_LEN;
        for (let i = 0; i < n; i++) {
          const x = G.VW / 2 - n * 62 + i * 124;
          U.panel(ctx, x + 8, y, 108, 96, { fill: 'rgba(24,14,40,0.9)', stroke: C.accent, shadow: false });
          U.text(ctx, code[i] || '', x + 62, y + 12, { size: 64, align: 'center' });
        }
      };
      if (this.state === 'join') {
        U.panel(ctx, 10, 10, 150, 46, { fill: 'rgba(24,14,40,0.88)', stroke: '#6b4f9a', shadow: false, r: 10 });
        U.text(ctx, '‹ Volver', 85, 20, { size: 18, align: 'center' });
        U.text(ctx, 'Escribe el código que te ha dado tu compañero', G.VW / 2, 70, { size: 18, align: 'center', color: C.text, bold: false });
        box(this.code, 100);
        this.keys().forEach((k) => {
          U.panel(ctx, k.x, k.y, k.w, k.h, { fill: U.hit(k.x, k.y, k.w, k.h) ? '#6a47b8' : 'rgba(70,50,110,0.9)', stroke: '#7d62b8', shadow: false, r: 12 });
          U.text(ctx, k.c, k.x + k.w / 2, k.y + 12, { size: 30, align: 'center' });
        });
      }
      if (this.state === 'host') {
        U.text(ctx, 'Dile este código a tu compañero', G.VW / 2, 90, { size: 20, align: 'center', bold: false });
        box(N.code || '', 130);
        const ok = N.remoteHere && !N.versionMismatch();
        if (N.remoteHere && N.versionMismatch()) this.msg = N.versionMsg(); else if (this.msg === N.versionMsg()) this.msg = '';
        U.text(ctx, ok ? 'Lali está conectada. ¡Cuando queráis!' : 'Esperando a Lali…' + '.'.repeat(1 + Math.floor(this.t * 2) % 3), G.VW / 2, 260, { size: 22, align: 'center', color: ok ? C.good : C.dim });
        U.text(ctx, 'Elegiste: ' + (G.CASES[this.a.caseId] ? G.CASES[this.a.caseId].title : '') + ' · ' + G.DIFFS[this.a.diff].name, G.VW / 2, 310, { size: 16, align: 'center', color: C.dim, bold: false });
        this.menu.draw(ctx);
      }
      if (this.state === 'wait') {
        box(N.code || '', 120);
        if (N.remoteHere && N.versionMismatch()) this.msg = N.versionMsg();
        U.text(ctx, N.remoteHere ? 'Conectada con Oli. Esperando a que empiece el caso…' : 'Entrando en la sala…', G.VW / 2, 270, { size: 22, align: 'center' });
        this.menu.draw(ctx);
      }
      if (this.msg) U.text(ctx, this.msg, G.VW / 2, G.VH - 60, { size: 16, align: 'center', color: C.bad, maxW: 800 });
    }
  }

  G.scenes.title = new Title();
  G.scenes.lobby = new Lobby();
  G.scenes.mode = new ModeSel();
  G.scenes.hub = new Hub();

  // ---------- arranque ----------
  G.boot = function (canvas) {
    const Q = 2;
    canvas.width = G.VW * Q;
    canvas.height = G.VH * Q;
    const ctx = canvas.getContext('2d');
    G.input.bindCanvas(canvas);
    G.save.load();
    G.errors = [];
    G.ctx = ctx;
    G.go(G.scenes.title);
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      try {
        G.input.update();
        G.scene.update(dt);
        ctx.setTransform(Q, 0, 0, Q, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.clearRect(0, 0, G.VW, G.VH);
        G.scene.draw(ctx);
        if (G.fadeIn > 0) { ctx.fillStyle = `rgba(10,5,20,${G.fadeIn * 4})`; ctx.fillRect(0, 0, G.VW, G.VH); G.fadeIn -= dt; }
        G.audio.tick();
        G.input.endFrame();
      } catch (e) {
        G.errors.push(String(e && e.stack || e));
        if (G.errors.length < 4) console.error(e);
        ctx.setTransform(Q, 0, 0, Q, 0, 0);
        ctx.fillStyle = 'rgba(80,0,0,0.85)'; ctx.fillRect(0, 0, G.VW, 80);
        ctx.fillStyle = '#fff'; ctx.font = '14px monospace'; ctx.fillText('Error: ' + String(e && e.message || e).slice(0, 110), 12, 30);
        ctx.fillText('Pulsa F5 para recargar. (el progreso guardado no se pierde)', 12, 56);
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  };
})(typeof window !== 'undefined' ? window : globalThis);

window.addEventListener('error', function (e) { var n = document.getElementById('nojs'); if (n) n.textContent = 'Error: ' + (e.message || e); });
window.addEventListener('load', function () { var c = document.getElementById('c'); c.focus(); window.__G = window.G; G.boot(c); var n = document.getElementById('nojs'); if (n) n.remove(); if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} } });
</script>
