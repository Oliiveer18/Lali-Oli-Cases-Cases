      return out;
    }
    lockedReply(npcId) {
      const nd = this.def.npcs[npcId];
      return { lines: [`(${nd.name} se ha cerrado en banda. Dale ${Math.ceil(this.lockLeft(npcId))} segundos para que se calme.)`], who: 'narrator', locked: true, name: nd.name };
    }
    startTalk(npcId) {
      const n = this.npc[npcId];
      const first = n.talks === 0;
      n.talks++;
      this.setFlag('talked_' + npcId);
      this.checkAdvance();
      return first ? { lines: this.def.npcs[npcId].first.slice(), who: npcId, name: this.def.npcs[npcId].name } : null;
    }
    ask(npcId, topicId) {
      if (this.isLocked(npcId)) return this.lockedReply(npcId);
      const nd = this.def.npcs[npcId];
      const t = nd.topics.find((x) => x.id === topicId);
      this.asked[npcId + ':' + topicId] = true;
      return this._run(t.responses, npcId);
    }
    chat(npcId) {
      if (this.isLocked(npcId)) return this.lockedReply(npcId);
      const n = this.npc[npcId];
      const nd = this.def.npcs[npcId];
      n.trust = G.clamp(n.trust + 1, 0, 6);
      n.pressure = Math.max(0, n.pressure - 1);
      const list = nd.chat || [['...']];
      const out = this._run([list[(n.chats + (n.off || 0)) % list.length]], npcId);
      n.chats++;
      if (nd.cat && n.chats === 3 && !this.flags.cat_reward) {
        this.setFlag('cat_reward');
        this.bonusMoney += nd.petReward || 10;
        out.lines.push('(Bigotes deja una moneda a tus pies. Debe de ser un gato con ahorros.)');
        out.sfx = 'pickup';
        out.catReward = true;
      }
      return out;
    }
    press(npcId) {
      if (this.isLocked(npcId)) return this.lockedReply(npcId);
      const n = this.npc[npcId];
      const nd = this.def.npcs[npcId];
      n.pressure = G.clamp(n.pressure + 1, 0, 8);
      n.presses++;
      return this._run(nd.press, npcId);
    }
    present(npcId, clueId) {
      if (this.isLocked(npcId)) return this.lockedReply(npcId);
      const nd = this.def.npcs[npcId];
      if (this.def.solution.proof.indexOf(clueId) >= 0) this.setFlag(`${npcId}_pres_${clueId}`);
      this.shown[npcId + ':' + clueId] = true;
      const list = nd.evidence[clueId] || nd.evidence['*'] || [{ say: nd.evidenceDefault }];
      let out = this._run(list, npcId);
      if (!out.lines.length) out = this._run([{ say: nd.evidenceDefault }], npcId);
      // ¡Protesto!: la prueba desmonta una mentira que el personaje había dicho (o le hace saltar)
      const L = this.def.lies && this.def.lies[npcId];
      if (L && L.refutedBy.indexOf(clueId) >= 0 && !this.flags['refuted_' + npcId] && (this.flags[L.flag] || out.sfx === 'crack')) {
        this.setFlag('refuted_' + npcId);
        out.objection = true;
        if (Object.keys(this.def.lies).every((k) => this.flags['refuted_' + k])) out.allRefuted = true;
      }
      return out;
    }

    // ---- sospechosos
    suspectCleared(sid) {
      const s = this.def.suspects.find((x) => x.id === sid);
      return !!s && s.clearedBy.length > 0 && s.clearedBy.every((c) => this.hasClue(c));
    }
    suspicion(sid) {
      let v = 0;
      this.clueOrder.forEach((c) => { const s = this.def.clues[c].sus; if (s && s[sid]) v += s[sid]; });
      return v;
    }
    topSuspect() {
      let best = null, bv = 0;
      this.def.suspects.forEach((s) => { const v = this.suspicion(s.id); if (v > bv && !this.suspectCleared(s.id)) { bv = v; best = s.id; } });
      return best && bv >= 2 ? best : null;
    }

    // ---- acceso y siguiente acción (motor de pistas)
    roomAccessible(roomId) {
      if (roomId === this.def.start.room) return true; // la sala de arranque la define el caso (formato oficial, fase 1B-2)
      let ok = false;
      Object.keys(this.def.rooms).forEach((rid) => {
        this.def.rooms[rid].doors.forEach((d) => {
          if (d.to.room === roomId) {
            if (!d.locked || this.chapter >= (d.locked.chapterMin || 1)) ok = true;
          }
        });
      });
      return ok;
    }
    propVisible(p) { return !p.visible || evalCond(p.visible, this, null); }
    propDone(p) { return p.steps && (this.progress[p.id] || 0) >= p.steps.length; }
    propStep(p) { return p.steps ? p.steps[this.progress[p.id] || 0] : null; }
    nextAction() {
      const def = this.def;
      const goals = this.goals().filter((g) => !g.done);
      const goalClues = new Set();
      goals.forEach((g) => (g.def.clues || (g.def.clue ? [g.def.clue] : [])).forEach((c) => goalClues.add(c)));
      const cands = [];
      Object.keys(def.rooms).forEach((rid) => {
        if (!this.roomAccessible(rid)) return;
        def.rooms[rid].props.forEach((p) => {
          if (!p.steps || this.propDone(p) || !this.propVisible(p)) return;
          const step = this.propStep(p);
          if (step.requires && !evalCond(step.requires, this, null)) return;
          const pr = step.clue && goalClues.has(step.clue) ? 0 : step.clue && !this.hasClue(step.clue) ? 1 : 2;
          cands.push({ kind: 'prop', room: rid, id: p.id, label: p.label || 'algo', tool: step.tool, pr, step });
        });
        def.rooms[rid].doors.forEach((d) => {
          if (d.firstOpen && !this.hasClue(d.firstOpen.clue) && (!d.locked || this.chapter >= (d.locked.chapterMin || 1))) {
            cands.push({ kind: 'door', room: rid, id: d.id, label: d.label ? 'la puerta: ' + d.label : 'una puerta', pr: goalClues.has(d.firstOpen.clue) ? 0 : 1 });
          }
          if (d.locked && !this.flags['unlocked_' + d.id] && this.chapter >= (d.locked.chapterMin || 1) && d.locked.tool) {
            cands.push({ kind: 'door', room: rid, id: d.id, label: 'la puerta: ' + d.label, tool: d.locked.tool, pr: 1 });
          }
        });
      });
      cands.sort((a, b) => a.pr - b.pr);
      const best = cands.find((c) => c.pr === 0) || null;
      if (best) return this._describe(best);
      // personajes
      const npcCands = [];
      Object.keys(def.npcs).forEach((nid) => {
        const pl = this.placementOf(nid);
        if (!pl || !this.roomAccessible(pl.room) || def.npcs[nid].cat) return;
        const nd = def.npcs[nid];
        if (!this.flags['talked_' + nid]) npcCands.push({ kind: 'npc', room: pl.room, id: nid, label: nd.name, text1: `Aún no has hablado con ${nd.name}.`, pr: goals.some((g) => g.def.flags) ? 0 : 1 });
        else {
          this.clueOrder.forEach((c) => {
            if (!this.shown[nid + ':' + c] && (nd.evidence[c] || (nd.evidence['*'] && def.solution.proof.indexOf(c) >= 0))) npcCands.push({ kind: 'npc', room: pl.room, id: nid, label: nd.name, text1: `Enseñar «${def.clues[c].title}» a ${nd.name} podría dar resultado.`, clue: c, pr: 1 });
          });
          this.topicsFor(nid).filter((t) => !t.seen).forEach((t) => npcCands.push({ kind: 'npc', room: pl.room, id: nid, label: nd.name, text1: `Pregúntale a ${nd.name}: «${t.label}»`, pr: 1 }));
        }
      });
      if (npcCands.length && (!cands.length || npcCands.some((c) => c.pr === 0))) {
        npcCands.sort((a, b) => a.pr - b.pr);
        return this._describe(npcCands[0]);
      }
      if (cands.length) return this._describe(cands[0]);
      if (npcCands.length) return this._describe(npcCands[0]);
      if (this.chapter >= def.chapters.length) return { kind: 'accuse', room: null, id: null, text1: 'Creo que ya tenemos suficiente: ¡abrid el cuaderno y acusad!', text2: 'Abre el cuaderno y pulsa «Acusar».' };
      return null;
    }
    _describe(c) {
      const rn = this.def.rooms[c.room] ? this.def.rooms[c.room].name : '';
      if (c.kind === 'npc') return { kind: 'npc', room: c.room, id: c.id, text1: c.text1, text2: c.text1, clue: c.clue };
      const t = c.tool ? ` (hace falta ${G.TOOLS[c.tool] ? G.TOOLS[c.tool].name : c.tool})` : '';
      return { kind: c.kind, room: c.room, id: c.id, tool: c.tool, text1: `Creo que en «${rn}» hay algo que merece otra mirada.`, text2: `Fíjate en ${c.label}${t}.` };
    }

    // ---- acusación
    boardOptions() {
      const d = this.diff;
      return { suspects: this.def.suspects.filter((s) => !(d.hideSuspects && s.easyHidden)), method: d.board >= 2, motive: d.board >= 2, proof: d.board >= 4 };
    }
    accuse(sel) {
      const sol = this.def.solution;
      const opt = this.boardOptions();
      const res = { culpritOk: sel.culprit === sol.culprit, methodOk: !opt.method || sel.method === sol.method, motiveOk: !opt.motive || sel.motive === sol.motive, proofOk: true };
      if (opt.proof) {
        const good = (sel.proof || []).filter((p) => sol.proof.indexOf(p) >= 0 && this.hasClue(p));
        res.proofOk = new Set(good).size >= 2;
      }
      res.ok = res.culpritOk && res.methodOk && res.motiveOk && res.proofOk;
      if (res.ok) {
        this.closed = true;
        this.setFlag('case_closed');
        this.checkAdvance();
      } else {
        this.wrong++;
        this.timePenalty += this.diff.wrongTime;
        if (this.wrong >= this.diff.strikes) { this.failed = true; res.failed = true; }
      }
      res.strikesLeft = this.diff.strikes < 90 ? this.diff.strikes - this.wrong : null;
      return res;
    }
    reward() {
      const def = this.def, d = this.diff;
      const foundFrac = this.clueCount() / this.totalClues();
      let stars = 1;
      if (this.elapsed() <= def.parSeconds) stars++;
      if (this.wrong === 0 && foundFrac >= 0.8) stars++;
      if (this.failed || !this.closed) stars = 0;
      const base = this.closed ? def.reward * d.mult * (1 + 0.25 * (stars - 1)) : Math.round(def.reward * 0.15);
      const pen = Math.min(0.6, d.wrongPenalty * this.wrong);
      const money = Math.round(base * (1 - pen)) + this.bonusMoney;
      return { stars, money, rep: stars * 5, foundFrac, time: this.elapsed() };
    }
  }
  G.CaseState = CaseState;

  // ---------------------------------------------------------------- DIRECTOR DE RITMO
  G.Director = class {
    constructor(st) {
      this.st = st;
      this.idle = 0;
      this.tier = 0;
      this.frustration = 0;
      this.lastClues = 0;
      this.cluesTimes = [];
      this.pending = null;
    }
    bump() { this.idle = 0; this.tier = 0; }
    denied() { this.frustration = Math.min(8, this.frustration + 1); }
    adapt() {
      if (!G.save.data.settings.adaptive) return 1;
      let a = 1 / (1 + 0.12 * this.frustration);
      if (this.cluesTimes.length >= 2) {
        const gaps = [];
        for (let i = 1; i < this.cluesTimes.length; i++) gaps.push(this.cluesTimes[i] - this.cluesTimes[i - 1]);
        const avg = gaps.reduce((s, v) => s + v, 0) / gaps.length;
        if (avg < 50) a *= 1.35;
      }
      return a;
    }
    update(dt, active) {
      const st = this.st;
      if (st.clueCount() !== this.lastClues) {
        this.lastClues = st.clueCount();
        this.cluesTimes.push(st.time);
        if (this.cluesTimes.length > 5) this.cluesTimes.shift();
        this.bump();
        this.frustration = Math.max(0, this.frustration - 2);
      }
      if (!active) return null;
      this.idle += dt;
      this.frustration = Math.max(0, this.frustration - dt * 0.02);
      const d = st.diff;
      const first = d.hintFirst * this.adapt();
      const every = d.hintEvery * this.adapt();
      if (!isFinite(first)) return null;
      const need = first + this.tier * every;
      if (this.idle >= need && this.tier < 3) {
        this.tier++;
        return { tier: this.tier, action: st.nextAction() };
      }
      return null;
    }
    request() {
      const st = this.st;
      const free = st.freeHints > 0;
      if (free) st.freeHints--;
      else st.timePenalty += st.diff.hintCost;
      st.hintsUsed++;
      this.tier = Math.min(3, Math.max(this.tier + 1, 1));
      this.idle = 0;
      return { tier: this.tier, action: st.nextAction(), free };
    }
  };

  // ---------------------------------------------------------------- VALIDADOR DE CASOS
  // Comprueba la estructura y SIMULA una partida perfecta para garantizar que el caso tiene solución.
  const validateInner = function (def) {
    const errors = [], warnings = [];
    const E = (m) => errors.push(m), W = (m) => warnings.push(m);
    // 0) formato oficial (schema.js): si la forma está mal no se puede seguir, porque el resto daría errores confusos o se rompería
    const fmt = G.checkCaseFormat(def);
    if (!fmt.shapeOk) return { ok: false, errors: fmt.errors, warnings: fmt.warnings, reached: 0, total: 0, chapter: 0, formatOk: false };
    fmt.errors.forEach(E); fmt.warnings.forEach(W);
    const spr = (n, where) => { if (n && !G.spr[n]) E(`Sprite inexistente "${n}" en ${where}`); };
    const clueIds = Object.keys(def.clues);

    // --- herramientas de los personajes (datos)
    const owners = {};
    G.ROLE_IDS.forEach((rid) => {
      const list = G.toolsOf(rid, def);
      if (!list.length) E(`Personaje ${rid}: no lleva ninguna herramienta`);
      list.forEach((t) => {
        if (!G.TOOLS[t]) E(`Personaje ${rid}: herramienta inexistente "${t}"`);
        else if (owners[t]) E(`La herramienta "${t}" la llevan dos personajes (${owners[t]} y ${rid})`);
        else owners[t] = rid;
      });
      if (def.startTool && def.startTool[rid] !== undefined && !(def.startTool[rid] >= 0 && def.startTool[rid] < list.length)) E(`Personaje ${rid}: startTool fuera de rango`);
    });
    const needTool = (t, where) => { if (t && t !== 'coop' && G.TOOLS[t] && !owners[t]) E(`${where}: la herramienta "${t}" no la lleva ningún personaje (caso imposible)`); };

    // --- estructura de salas
    Object.keys(def.rooms).forEach((rid) => {
      const r = def.rooms[rid];
      const w = r.map[0].length;
      r.map.forEach((row, i) => { if (row.length !== w) E(`Sala ${rid}: la fila ${i} tiene ${row.length} columnas y debería tener ${w}`); });
      const H = r.map.length;
      const solidAt = (x, y) => r.map[y] && r.map[y][x] === '#';
      const seen = {};
      r.props.forEach((p) => {
        if (seen[p.id]) E(`Sala ${rid}: id de objeto repetido "${p.id}"`);
        seen[p.id] = true;
        if (p.x < 0 || p.y < 0 || p.x >= w || p.y >= H) E(`Sala ${rid}: objeto ${p.id} fuera del mapa (${p.x},${p.y})`);
        spr(p.sprite, `objeto ${p.id}`);
        if (p.swap) spr(p.swap.sprite, `objeto ${p.id} (swap)`);
        if (p.uvMark) spr(p.uvMark.sprite, `objeto ${p.id} (uvMark)`);
        if (p.steps) p.steps.forEach((s, i) => {
          if (s.clue && !def.clues[s.clue]) E(`Objeto ${p.id}: pista inexistente "${s.clue}"`);
          if (s.tool && s.tool !== 'coop' && !G.TOOLS[s.tool]) E(`Objeto ${p.id}: herramienta inexistente "${s.tool}"`);
          needTool(s.tool, `Objeto ${p.id}`);
          if (!s.text) E(`Objeto ${p.id}: el paso ${i} no tiene texto`);
          if (s.mini) {
            const mi = s.mini;
            if (mi.type === 'code') { if (!/^\d{3,6}$/.test(String(mi.code || ''))) E(`Objeto ${p.id}: código del minijuego inválido`); }
            else if (mi.type === 'timeline') {
              if (!mi.events || mi.events.length < 3) E(`Objeto ${p.id}: la línea de tiempo necesita 3 sucesos o más`);
              (mi.events || []).forEach((ev) => { if (ev.clue && !def.clues[ev.clue]) E(`Objeto ${p.id}: suceso con pista inexistente ${ev.clue}`); });
            } else E(`Objeto ${p.id}: tipo de minijuego desconocido "${mi.type}"`);
          }
        });
        if (p.steps && !p.solid && !p.label) W(`Objeto interactivo sin etiqueta: ${p.id}`);
        if (p.ref && !r.props.find((q) => q.id === p.ref)) E(`Objeto ${p.id}: referencia a "${p.ref}" que no existe`);
        if (p.solid && p.y < H && p.x < w && solidAt(p.x, p.y) && !(p.y === 0)) E(`Objeto ${p.id} está dentro de una pared (${p.x},${p.y})`);
      });
      const seenDoor = {};
      r.doors.forEach((d) => {
        spr(d.sprite, `puerta ${d.id}`);
        if (d.locked) needTool(d.locked.tool, `Puerta ${d.id}`);
        const tr = def.rooms[d.to.room];
        if (!tr) { E(`Puerta ${d.id}: destino inexistente "${d.to.room}"`); return; }
        if (r.doors.filter((x) => x.id === d.id).length > 1) E(`Sala ${rid}: id de puerta repetido "${d.id}"`);
        const back = tr.doors.find((x) => x.id === d.to.door);
        if (!back) E(`Puerta ${d.id}: la puerta de destino "${d.to.door}" no existe en ${d.to.room}`);
        else if (back.to.room !== rid || back.to.door !== d.id) E(`Puerta ${d.id}: la puerta de vuelta no apunta aquí`);
        // posición dentro del muro (fase 1B-1)
        const wl = d.wall === undefined ? 'n' : d.wall;
        if (!G.WALLS[wl]) { E(`Puerta ${d.id}: pared desconocida "${d.wall}" (usa n, s, e o w)`); return; }
        const dy = d.y || 0;
        const onWall = wl === 'n' ? dy === 0 : wl === 's' ? dy === H - 1 : wl === 'w' ? d.x === 0 : d.x === w - 1;
        if (!onWall) E(`Puerta ${d.id}: no está en el muro ${{ n: 'norte (y=0)', s: 'sur (y=' + (H - 1) + ')', w: 'oeste (x=0)', e: 'este (x=' + (w - 1) + ')' }[wl]} (está en ${d.x},${dy})`);
        else {
          const along = wl === 'n' || wl === 's' ? d.x : dy, len = wl === 'n' || wl === 's' ? w : H;
          if (along < 1 || along > len - 2) E(`Puerta ${d.id}: está en una esquina del muro`);
          if (!solidAt(d.x, dy)) E(`Puerta ${d.id}: la baldosa del muro (${d.x},${dy}) no es pared`);
          const ins = G.doorInside(d);
          if (solidAt(ins.x, ins.y)) E(`Puerta ${d.id}: la baldosa de delante (${ins.x},${ins.y}) es pared, nadie podría llegar`);
          else if (r.props.some((p) => p.solid && ins.x >= p.x && ins.x < p.x + (p.w || 1) && ins.y >= p.y && ins.y < p.y + (p.h || 1))) E(`Puerta ${d.id}: hay un objeto sólido delante de la puerta (${ins.x},${ins.y})`);
        }
        if (seenDoor[d.x + ',' + dy]) E(`Puerta ${d.id}: comparte baldosa con la puerta ${seenDoor[d.x + ',' + dy]}`);
        seenDoor[d.x + ',' + dy] = d.id;
      });
      (r.decor || []).concat(r.decals || []).forEach((d) => spr(d.sprite, 'decoración de ' + rid));
    });
    Object.keys(def.placement || {}).forEach((nid) => {
      if (!def.npcs[nid]) E(`Colocación de personaje desconocido "${nid}"`);
      def.placement[nid].forEach((p) => {
        const r = def.rooms[p.room];
        if (!r) { E(`Personaje ${nid}: sala inexistente ${p.room}`); return; }
        if (r.map[p.y] && r.map[p.y][p.x] === '#') E(`Personaje ${nid} dentro de una pared en ${p.room}`);
        if (r.props.some((q) => q.solid && q.x === p.x && q.y === p.y)) E(`Personaje ${nid} colocado encima de un objeto sólido en ${p.room} (${p.x},${p.y})`);
      });
    });
    def.suspects.forEach((s) => s.clearedBy.forEach((c) => { if (!def.clues[c]) E(`Sospechoso ${s.id}: pista de descarte inexistente ${c}`); }));
    if (!def.suspects.find((s) => s.id === def.solution.culprit)) E('La solución apunta a un culpable inexistente');
    def.solution.proof.forEach((c) => { if (!def.clues[c]) E(`Prueba de la solución inexistente: ${c}`); });
    ['methods', 'motives'].forEach((k) => def.solution[k].forEach((o) => (o.needs || []).forEach((c) => { if (!def.clues[c]) E(`Opción ${o.id}: pista inexistente ${c}`); })));
    if (!def.solution.methods.find((m) => m.id === def.solution.method)) E('Método correcto inexistente');
    if (!def.solution.motives.find((m) => m.id === def.solution.motive)) E('Motivo correcto inexistente');
    // NPC
    Object.keys(def.npcs).forEach((nid) => {
      const nd = def.npcs[nid];
      const checkList = (list, where) => (list || []).forEach((e) => {
        const r = Array.isArray(e) ? { say: e } : e;
        if (!r.say || !r.say.length) E(`${nid} ${where}: respuesta sin texto`);
        if (r.fx && r.fx.clue) [].concat(r.fx.clue).forEach((c) => { if (!def.clues[c]) E(`${nid} ${where}: pista inexistente ${c}`); });
      });
      nd.topics.forEach((t) => checkList(t.responses, 'tema ' + t.id));
      checkList(nd.chat, 'chat');
      checkList(nd.press, 'presionar');
      Object.keys(nd.evidence).forEach((c) => { if (c !== '*' && !def.clues[c]) E(`${nid}: evidencia para pista inexistente ${c}`); checkList(nd.evidence[c], 'evidencia ' + c); });
    });

    // --- simulación de una partida perfecta
    const st = new CaseState(def, 'normal');
    const profiles = [{ trust: 6, pressure: 0 }, { trust: 0, pressure: 8 }, { trust: 6, pressure: 8 }, { trust: 3, pressure: 4 }, { trust: 0, pressure: 0 }];
    let guard = 0, changed = true;
    const sig = () => st.clueOrder.length + '|' + Object.keys(st.flags).length + '|' + st.chapter + '|' + JSON.stringify(st.progress);
    while (changed && guard++ < 400) {
      const before = sig();
      st.time += 1000; // los bloqueos por presión expiran
      // objetos
      Object.keys(def.rooms).forEach((rid) => {
        if (!st.roomAccessible(rid)) return;
        def.rooms[rid].props.forEach((p) => {
          if (!p.steps || !st.propVisible(p)) return;

  const T = {

    id: (v, p, a) => { if (typeof v !== 'string' || !ID.test(v)) a(p, 'debe ser un id (letras, números y _, empezando por letra)'); },
    bool: (v, p, a) => { if (typeof v !== 'boolean') a(p, 'debe ser verdadero o falso'); },
    int: (min, max) => (v, p, a) => { if (!Number.isInteger(v) || v < min || v > max) a(p, `debe ser un entero entre ${min} y ${max}`); },
    oneOf: (list) => (v, p, a) => { if (list.indexOf(v) < 0) a(p, `debe ser uno de: ${list.join(', ')}`); },
    nullable: (f) => (v, p, a) => { if (v !== null) f(v, p, a); },
    list: (item) => (v, p, a) => { if (!Array.isArray(v)) return a(p, 'debe ser una lista'); v.forEach((x, i) => item(x, `${p}[${i}]`, a)); },
    dict: (item) => (v, p, a) => {
      if (!isObj(v)) return a(p, 'debe ser un objeto');
      Object.keys(v).forEach((k) => { if (!ID.test(k)) a(`${p}.${k}`, 'la clave debe ser un id'); item(v[k], `${p}.${k}`, a); });
    },
    obj: (req, opt) => (v, p, a) => {
      if (!isObj(v)) return a(p, 'debe ser un objeto');
      Object.keys(req).forEach((k) => (has(v, k) ? req[k](v[k], `${p}.${k}`, a) : a(`${p}.${k}`, 'falta el campo obligatorio')));
      Object.keys(v).forEach((k) => {
        if (has(req, k)) return;
        if (opt && has(opt, k)) opt[k](v[k], `${p}.${k}`, a);
        else a(`${p}.${k}`, 'campo desconocido (¿errata?)');
      });
    },
  };
  const TRAITS = ['nervioso', 'soberbio', 'evasivo', 'amable', 'seco'];
  const KINDS = ['física', 'documento', 'grabación', 'testimonio'];
  const CLUE_ROLES = ['prueba', 'descarte', 'falsa', 'refuta', 'ambiente'];
  const idList = T.list(T.id);
  const minute = T.int(0, 1440);
  const named = { id: T.id, text: T.str };
  const SHAPE = T.obj({
    format: T.int(1, 1), gen: T.int(1, 1000000), seed: T.int(0, 4294967295), schema: T.oneOf(['robo']), code: T.str,
    places: T.list(T.obj({ id: T.id, name: T.str })),
    object: T.obj({ id: T.id, name: T.str, place: T.id }),
    cast: T.list(T.obj({ id: T.id, name: T.str, role: T.oneOf(['cliente', 'sospechoso']), look: T.str, trait: T.oneOf(TRAITS) })),
    truth: T.obj({
      culprit: T.id,
      method: T.obj({ id: T.id, text: T.str, needs: idList }),
      motive: T.obj({ id: T.id, text: T.str, needs: idList }),
      window: T.obj({ from: minute, to: minute, place: T.id }),
      timeline: T.list(T.obj({ t: minute, until: minute, who: T.id, place: T.id, doing: T.str, witnesses: idList })),
      decoys: T.obj({ methods: T.list(T.obj(named, { needs: idList })), motives: T.list(T.obj(named, { needs: idList })) }),
    }),
    alibis: T.dict(T.obj({ claim: T.obj({ place: T.id, from: minute, to: minute }), holds: T.bool, clearedBy: T.nullable(T.id) })),
    lies: T.list(T.obj({ who: T.id, said: T.str, truth: T.str, refutedBy: idList })),
    clues: T.list(T.obj({
      id: T.id, title: T.str, kind: T.oneOf(KINDS), text: T.str, role: T.oneOf(CLUE_ROLES),
      points: T.dict(T.int(-20, 20)),
      source: T.obj({ type: T.oneOf(['prop', 'npc']) }, { place: T.id, npc: T.id, topic: T.id }),
      derivedFrom: T.nullable(T.int(0, 9999)),
    })),
    proof: idList,
  }, {
    captureForm: T.oneOf(Object.keys(G.CAPTURE_FORMS)), level: T.oneOf(G.LEVELS),
    deceptive: T.list(T.obj({ who: T.id, why: T.str })),
    mood: T.oneOf(G.MOODS), matiz: T.list(T.id),
  });

  // recorre el objeto: solo datos puros (null, booleano, texto, número finito, listas, objetos) y sin ciclos
  function plain(v, p, a, depth) {
    if (depth > 12) return a(p, 'demasiado profundo (¿referencia circular?)');
    if (v === null || typeof v === 'boolean' || typeof v === 'string') return;
    if (typeof v === 'number') { if (!isFinite(v)) a(p, 'número no finito'); return; }
    if (Array.isArray(v)) return v.forEach((x, i) => plain(x, `${p}[${i}]`, a, depth + 1));
    if (isObj(v)) return Object.keys(v).forEach((k) => plain(v[k], `${p}.${k}`, a, depth + 1));
    a(p, 'no es un dato serializable (' + typeof v + ')');
  }

  // ---------- consultas sobre la cronología
  const overlap = (a0, a1, b0, b1) => a0 < b1 && b0 < a1;
  function covers(entries, from, to) { // ¿la unión de las franjas cubre [from,to]?
    const iv = entries.map((e) => [e.t, e.until]).sort((x, y) => x[0] - y[0]);
    let cur = from;
    for (let i = 0; i < iv.length && cur < to; i++) { if (iv[i][0] > cur) break; if (iv[i][1] > cur) cur = iv[i][1]; }
    return cur >= to;
  }

  G.checkBible = function (b, opts) {
    const errors = [];
    const partial = !!(opts && opts.partial);
    try {
      const addF = (p, m) => errors.push({ code: 'formato', path: 'biblia' + p.replace(/^\$/, ''), msg: m });
      if (!isObj(b)) { addF('', 'La biblia debe ser un objeto'); return { ok: false, errors }; }
      plain(b, '$', addF, 0);
      if (!errors.length) {
        SHAPE(b, '$', addF);
        if (!errors.length) {
          if (b.gen !== G.GEN_VERSION) addF('.gen', `la biblia es del generador ${b.gen} y este es el ${G.GEN_VERSION}`);
          if (b.code !== 'G' + b.gen + '-' + b.seed.toString(36)) addF('.code', 'el código no corresponde a la semilla y versión');
          [['places', b.places], ['cast', b.cast], ['clues', b.clues]].forEach(([n, l]) => {
            const seen = {};
            l.forEach((x, i) => { if (seen[x.id]) addF(`.${n}[${i}].id`, `id repetido: ${x.id}`); seen[x.id] = 1; });
          });
        }
      }
      if (errors.length) return { ok: false, errors };
      semantic(b, partial, (code, path, msg) => errors.push({ code, path: 'biblia' + path, msg }));
    } catch (e) {
      errors.push({ code: 'formato', path: 'biblia', msg: 'Error interno al comprobar la biblia (dato mal formado): ' + (e && e.message ? e.message : e) });
    }
    return { ok: errors.length === 0, errors };
  };

  function semantic(b, partial, add) {
    const tr = b.truth, win = tr.window, tl = tr.timeline, cu = tr.culprit;
    const ids = (l) => l.map((x) => x.id);
    const castIds = ids(b.cast), placeIds = ids(b.places);
    const sus = b.cast.filter((c) => c.role === 'sospechoso'), susIds = ids(sus);
    const inn = susIds.filter((s) => s !== cu);
    const clue = {}; b.clues.forEach((c) => { clue[c.id] = c; });
    const presentAt = (who, place, from, to) => covers(tl.filter((e) => e.who === who && e.place === place), from, to);
    const validSpan = (f, t) => f < t;

    // ---- reparto
    if (b.cast.filter((c) => c.role === 'cliente').length !== 1) add('reparto', '.cast', 'Debe haber exactamente 1 cliente');
    if (sus.length < 4 || sus.length > 6) add('reparto', '.cast', `Debe haber de 4 a 6 sospechosos (hay ${sus.length})`);
    if (susIds.indexOf(cu) < 0) add('reparto', '.truth.culprit', `El culpable (${cu}) no es un sospechoso del reparto`);
    b.cast.forEach((c, i) => {
      if (['rex', 'luna', 'narrator'].indexOf(c.id) >= 0) add('reparto', `.cast[${i}].id`, `«${c.id}» está reservado por el motor`);
      if (!G.LOOKS || !G.LOOKS[c.look]) add('reparto', `.cast[${i}].look`, `el aspecto «${c.look}» no existe en G.LOOKS`);
    });
    { const seenL = {}; // 4B: dos personajes del mismo caso no pueden tener el mismo aspecto
      b.cast.forEach((c, i) => { if (c.look && seenL[c.look] !== undefined) add('reparto', `.cast[${i}].look`, `«${c.look}» ya lo lleva ${b.cast[seenL[c.look]].id}: dos personajes del mismo caso no pueden verse iguales`); else seenL[c.look] = i; }); }
    susIds.forEach((s) => { if (!has(b.alibis, s)) add('reparto', `.alibis.${s}`, 'Falta la coartada de este sospechoso'); });
    Object.keys(b.alibis).forEach((k) => { if (susIds.indexOf(k) < 0) add('reparto', `.alibis.${k}`, 'Coartada de alguien que no es sospechoso'); });

    // ---- engañosos (4A): solo inocentes, sin repetir, en el rango del nivel y sin pasar del máximo según el nº de sospechosos
    const dec = b.deceptive || [], maxD = G.maxDecoys(sus.length), seenD = {};
    if (dec.length > maxD) add('enganosos', '.deceptive', `Con ${sus.length} sospechosos solo puede haber ${maxD} engañosos como mucho (hay ${dec.length})`);
    if (b.level) {
      const rg = G.DECOY_RANGE[b.level], lo = Math.min(rg[0], maxD), hi = Math.min(rg[1], maxD);
      if (dec.length < lo || dec.length > hi) add('enganosos', '.deceptive', `El nivel «${b.level}» admite de ${lo} a ${hi} engañosos con ${sus.length} sospechosos (hay ${dec.length})`);
    }
    dec.forEach((d, i) => {
      if (inn.indexOf(d.who) < 0) add('enganosos', `.deceptive[${i}].who`, `«${d.who}» debe ser un sospechoso inocente`);
      if (seenD[d.who]) add('enganosos', `.deceptive[${i}].who`, `«${d.who}» está repetido`); seenD[d.who] = 1;
    });

    // ---- lugares
    if (b.places.length < 3 || b.places.length > 5) add('lugares', '.places', `Debe haber de 3 a 5 lugares (hay ${b.places.length})`);
    const needPlace = (pl, p) => { if (placeIds.indexOf(pl) < 0) add('lugares', p, `el lugar «${pl}» no existe`); };
    needPlace(b.object.place, '.object.place');
    needPlace(win.place, '.truth.window.place');
    if (win.place !== b.object.place) add('lugares', '.truth.window.place', 'El robo debe ocurrir donde estaba el objeto');
    tl.forEach((e, i) => needPlace(e.place, `.truth.timeline[${i}].place`));
    Object.keys(b.alibis).forEach((k) => needPlace(b.alibis[k].claim.place, `.alibis.${k}.claim.place`));

    // ---- cronología
    const who = {};
    tl.forEach((e, i) => {
      const p = `.truth.timeline[${i}]`;
      if (!validSpan(e.t, e.until)) add('cronologia', p, `La franja ${G.minToStr(e.t)}-${G.minToStr(e.until)} debe tener t < until`);
      if (castIds.indexOf(e.who) < 0) add('cronologia', p + '.who', `«${e.who}» no está en el reparto`);
      if (i && tl[i - 1].t > e.t) add('cronologia', p + '.t', 'La cronología debe ir ordenada por hora de inicio');
      (who[e.who] = who[e.who] || []).push(e);
      e.witnesses.forEach((w, j) => {
        if (castIds.indexOf(w) < 0) return add('cronologia', `${p}.witnesses[${j}]`, `El testigo «${w}» no está en el reparto`);
        if (w === e.who) return add('cronologia', `${p}.witnesses[${j}]`, 'Nadie es testigo de sí mismo');
        if (!tl.some((o) => o.who === w && o.place === e.place && overlap(o.t, o.until, e.t, e.until))) add('cronologia', `${p}.witnesses[${j}]`, `«${w}» figura como testigo pero no está en ${e.place} en esa franja`);
      });
    });
    Object.keys(who).forEach((w) => {
      const l = who[w].slice().sort((x, y) => x.t - y.t || x.until - y.until);
      for (let i = 1; i < l.length; i++) if (l[i - 1].until > l[i].t) add('cronologia', '.truth.timeline', `«${w}» está en dos sitios a la vez (${G.minToStr(l[i].t)}-${G.minToStr(Math.min(l[i - 1].until, l[i].until))})`);
    });

    // ---- ventana del robo
    if (!validSpan(win.from, win.to)) add('ventana', '.truth.window', 'La ventana debe tener from < to');
    else {
      if (!presentAt(cu, win.place, win.from, win.to)) add('ventana', '.truth.window', `El culpable no está en ${win.place} durante toda la ventana del robo`);
      b.cast.forEach((c) => {
        if (c.id !== cu && tl.some((e) => e.who === c.id && e.place === win.place && overlap(e.t, e.until, win.from, win.to))) add('ventana', '.truth.timeline', `«${c.id}» está en el lugar del robo durante la ventana: no es el único que pudo hacerlo`);
      });
    }

    // ---- coartada del culpable
    const ac = b.alibis[cu];
    if (ac) {
      if (ac.holds !== false) add('coartada_culpable', `.alibis.${cu}.holds`, 'La coartada del culpable no debe sostenerse');
      if (ac.claim.place === win.place) add('coartada_culpable', `.alibis.${cu}.claim`, 'El culpable no puede afirmar que estaba en el lugar del robo');
      if (!validSpan(ac.claim.from, ac.claim.to) || !overlap(ac.claim.from, ac.claim.to, win.from, win.to)) add('coartada_culpable', `.alibis.${cu}.claim`, 'La coartada del culpable debe cubrir parte de la ventana del robo');
      else if (presentAt(cu, ac.claim.place, ac.claim.from, ac.claim.to)) add('coartada_culpable', `.alibis.${cu}.claim`, 'La cronología confirma lo que dice el culpable: su coartada no es mentira');
    }

    // ---- coartada de los inocentes (la parte que depende de pistas se salta en modo parcial)
    let uncleared = 0;
    inn.forEach((s) => {
      const a = b.alibis[s], p = `.alibis.${s}`;
      if (!a) return;
      if (!validSpan(a.claim.from, a.claim.to)) add('coartada_inocente', p + '.claim', 'La franja de la coartada debe tener from < to');
      else if (a.holds !== presentAt(s, a.claim.place, a.claim.from, a.claim.to)) add('coartada_inocente', p + '.holds', `«holds» (${a.holds}) no coincide con la cronología`);
      if (validSpan(win.from, win.to) && !b.places.some((pl) => pl.id !== win.place && presentAt(s, pl.id, win.from, win.to))) add('coartada_inocente', p, `«${s}» no tiene en la cronología una posición verificable fuera del lugar del robo durante toda la ventana`);
      if (partial) return;
      if (a.clearedBy === null) { uncleared++; return; }
      const c = clue[a.clearedBy], e = c && Number.isInteger(c.derivedFrom) ? tl[c.derivedFrom] : null;
      if (!c) add('coartada_inocente', p + '.clearedBy', `la pista «${a.clearedBy}» no existe`);
      else if (c.role !== 'descarte') add('coartada_inocente', p + '.clearedBy', `«${c.id}» debe tener rol «descarte»`);
      else if (!e || e.who !== s || e.place === win.place || !overlap(e.t, e.until, win.from, win.to)) add('coartada_inocente', p + '.clearedBy', `«${c.id}» debe derivar de una franja de «${s}» fuera del lugar del robo y dentro de la ventana`);
    });
    if (!partial && uncleared > 1) add('coartada_inocente', '.alibis', `Solo un inocente puede quedarse sin pista de descarte (hay ${uncleared})`);
    if (partial) return;

    // ---- mentiras
    const lies = {};
    b.lies.forEach((l, i) => {
      const p = `.lies[${i}]`, a = b.alibis[l.who];
      if (susIds.indexOf(l.who) < 0) return add('mentiras', p + '.who', `«${l.who}» no es sospechoso`);
      if (lies[l.who]) add('mentiras', p + '.who', `«${l.who}» miente dos veces: solo se admite una mentira por personaje`);
      lies[l.who] = l;
      if (a && a.holds !== false) add('mentiras', p, `«${l.who}» miente pero su coartada «se sostiene» según la cronología`);
      if (!l.refutedBy.length) add('mentiras', p + '.refutedBy', 'Una mentira necesita al menos una pista que la desmonte');
      l.refutedBy.forEach((r, j) => { if (!clue[r]) add('mentiras', `${p}.refutedBy[${j}]`, `la pista «${r}» no existe`); });
      const ext = l.refutedBy.map((r) => clue[r]).filter((c) => {
        if (!c || !(c.source.type === 'prop' || c.source.npc !== l.who) || !Number.isInteger(c.derivedFrom)) return false;
        const e = tl[c.derivedFrom];
        return !!(e && a && e.who === l.who && e.place !== a.claim.place && overlap(e.t, e.until, a.claim.from, a.claim.to));
      });
      if (!ext.length) add('mentiras', p + '.refutedBy', `Ninguna pista ajena a «${l.who}» y derivada de su cronología contradice lo que dice: la mentira sería indemostrable o circular`);
    });
    if (!lies[cu]) add('mentiras', '.lies', 'El culpable debe mentir');
    if (b.lies.length < 2 || !inn.some((s) => lies[s])) add('mentiras', '.lies', 'Debe haber al menos 2 mentiras: la del culpable y la de algún inocente');
    susIds.forEach((s) => { if (b.alibis[s] && b.alibis[s].holds === false && !lies[s]) add('mentiras', `.alibis.${s}`, `La coartada de «${s}» es falsa pero no figura en «lies»`); });

    // ---- pruebas contra el culpable
    const seenP = {};
    if (b.proof.length < 3) add('pruebas', '.proof', `Hacen falta al menos 3 pruebas (hay ${b.proof.length})`);
    b.proof.forEach((id, i) => {
      const c = clue[id], p = `.proof[${i}]`, e = c && Number.isInteger(c.derivedFrom) ? tl[c.derivedFrom] : null;
      if (seenP[id]) add('pruebas', p, `prueba repetida: ${id}`); seenP[id] = 1;
      if (!c) return add('pruebas', p, `la pista «${id}» no existe`);
      if (c.role !== 'prueba') add('pruebas', p, `«${id}» debe tener rol «prueba»`);
      if (!(c.points[cu] > 0)) add('pruebas', p, `«${id}» no suma puntos contra el culpable`);
      if (!e || e.who !== cu) add('pruebas', p, `«${id}» debe derivar de una franja de la cronología del culpable`);
    });

    // ---- forma de captura (4A): las pruebas de proof son exactamente las que pide la forma
    if (b.captureForm) {
      const want = G.CAPTURE_FORMS[b.captureForm].proof.slice().sort().join(','), got = b.proof.map((id) => id.split('_')[0]).sort().join(',');
      if (want !== got) add('forma_captura', '.proof', `La forma «${b.captureForm}» exige las pruebas [${want}] y hay [${got}]`);
    }

    // ---- pistas falsas
    inn.forEach((s) => {
      if (!b.clues.some((c) => c.role === 'falsa' && c.points[s] > 0 && !seenP[c.id])) add('pistas_falsas', `.alibis.${s}`, `«${s}» no tiene ninguna pista falsa (rol «falsa», puntos > 0, fuera de proof)`);
    });

    // ---- puntos de sospecha
    const score = {}; susIds.forEach((s) => { score[s] = 0; });
    b.clues.forEach((c, i) => {
      const p = `.clues[${i}]`, pts = c.points, ks = Object.keys(pts);
      ks.forEach((k) => { if (susIds.indexOf(k) < 0) add('puntos', `${p}.points.${k}`, 'solo se puntúa a sospechosos'); else score[k] += pts[k]; });
      if (c.role === 'prueba' && !(pts[cu] > 0)) add('puntos', p, `«${c.id}» es una prueba pero no suma contra el culpable`);
      if (c.role === 'falsa' && (pts[cu] > 0 || !ks.some((k) => pts[k] > 0))) add('puntos', p, `«${c.id}» es una pista falsa: debe sospechar de un inocente y nunca del culpable`);
      if (c.role === 'descarte' && ks.some((k) => pts[k] > 0)) add('puntos', p, `«${c.id}» es un descarte: no puede sumar sospecha`);
      if (c.role === 'ambiente' && ks.length) add('puntos', p, `«${c.id}» es de ambiente: no lleva puntos`);
    });
    if (score[cu] < 12) add('puntos', '.clues', `Las pistas suman solo ${score[cu]} puntos contra el culpable (mínimo 12)`);
    inn.forEach((s) => { if (b.alibis[s] && b.alibis[s].clearedBy === null && score[cu] - score[s] < 3) add('puntos', `.alibis.${s}`, `«${s}» no se puede descartar y queda a ${score[cu] - score[s]} puntos del culpable (mínimo 3)`); });

    // ---- engañosos con puntos (4A): descartables y casi tan sospechosos como el culpable (misma medida que la huella: suma neta de puntos)
    dec.forEach((d, i) => {
      const al = b.alibis[d.who];
      if (!al || al.clearedBy === null) add('enganosos', `.deceptive[${i}]`, `«${d.who}» es engañoso pero no tiene pista de descarte: tiene que poder descartarse`);
      if (score[d.who] === undefined) return;
      if (score[d.who] < G.DECOY_RATIO * score[cu]) add('enganosos', `.deceptive[${i}]`, `«${d.who}» suma ${score[d.who]} puntos y el culpable ${score[cu]}: un engañoso debe llegar al ${Math.round(G.DECOY_RATIO * 100)} %`);
    });

    // ---- matiz (4C-4c-1): nº según el ambiente, solo pistas de objeto de rol prueba/falsa/refuta, sin repetir; sin `mood` no hay matiz
    {
      const mz = b.matiz || [], want = b.mood ? G.MATIZ_COUNT[b.mood] : 0, seenM = {};
      if (mz.length !== want) add('matiz', '.matiz', `Con ambiente «${b.mood || 'sin mood'}» debe haber ${want} pistas con matiz (hay ${mz.length})`);
      mz.forEach((id, i) => {
        const c = b.clues.filter((x) => x.id === id)[0];
        if (!c) add('matiz', `.matiz[${i}]`, `«${id}» no es una pista`);
        else if (c.source.type !== 'prop' || ['prueba', 'falsa', 'refuta'].indexOf(c.role) < 0) add('matiz', `.matiz[${i}]`, `«${id}»: el matiz solo va en pistas de objeto de rol prueba, falsa o refuta (es ${c.source.type}/${c.role})`);
        if (seenM[id]) add('matiz', `.matiz[${i}]`, `«${id}» está repetida`); seenM[id] = 1;
      });
    }

    // ---- alcanzabilidad de las pistas
    const perPlace = {};
    b.clues.forEach((c, i) => {
      const p = `.clues[${i}]`, s = c.source;

    // ---------- efectos
    puff(x, y) { for (let i = 0; i < 7; i++) this.fx.push({ t: 0, life: 0.6, x: x + (Math.random() - 0.5) * 24, y: y + (Math.random() - 0.5) * 14, vx: (Math.random() - 0.5) * 40, vy: -20 - Math.random() * 20, k: 'puff', r: 8 + Math.random() * 8 }); }
    sparkleBurst(x, y, n, small) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 40 + Math.random() * 70; this.fx.push({ t: 0, life: 0.7 + Math.random() * 0.4, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, k: 'spark', r: small ? 4 : 7 }); } }
    updateFx(dt) {
      for (let i = this.fx.length - 1; i >= 0; i--) {
        const f = this.fx[i];
        f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += (f.k === 'spark' ? 90 : -10) * dt;
        if (f.t >= f.life) this.fx.splice(i, 1);
      }
    }

    // ---------- cámara
    viewports() { return [{ x: 0, y: 0, w: G.VW, h: G.VH }]; }
    camTarget(vp, fx, fy) {
      const r = this.room;
      let x = fx - vp.w / 2, y = fy - vp.h / 2;
      x = r.pw <= vp.w ? -(vp.w - r.pw) / 2 : G.clamp(x, 0, r.pw - vp.w);
      y = r.ph <= vp.h ? -(vp.h - r.ph) / 2 : G.clamp(y, 0, r.ph - vp.h);
      return { x, y };
    }
    focusPoint() {
      const p = this.players;
      if (this.mode !== 'coop') { const l = this.leader(); return { x: l.x, y: l.y - 20 }; }
      return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 - 20 };
    }
    snapCamera() {
      const f = this.focusPoint();
      const t = this.camTarget(this.viewports()[0], f.x, f.y);
      this.cam[0].x = t.x; this.cam[0].y = t.y;
      this.cam[1].x = t.x; this.cam[1].y = t.y;
    }
    updateCamera(dt) {
      const k = Math.min(1, dt * 6);
      const f = this.focusPoint();
      const t = this.camTarget(this.viewports()[0], f.x, f.y);
      this.cam[0].x += (t.x - this.cam[0].x) * k; this.cam[0].y += (t.y - this.cam[0].y) * k;
      this.cam[1].x = this.cam[0].x; this.cam[1].y = this.cam[0].y;
    }

    // ---------- objetivo (flecha amistosa)
    roomRoute(from, to) {
      if (from === to) return null;
      const defs = this.st.def.rooms;
      const q = [[from, null]], seen = { [from]: true };
      while (q.length) {
        const [cur, first] = q.shift();
        for (const d of defs[cur].doors) {
          const nx = d.to.room;
          if (seen[nx]) continue;
          seen[nx] = true;
          const f = first || d;
          if (nx === to) return f;
          q.push([nx, f]);
        }
      }
      return null;
    }
    targetPos() {
      const t = this.target;
      if (!t) return null;
      const defs = this.st.def.rooms;
      if (t.kind === 'accuse') return null;
      let rm = t.room;
      if (t.kind === 'npc') { const pl = this.st.placementOf(t.id); rm = pl && pl.room; }
      if (!rm) return null;
      if (rm !== this.roomId) {
        const door = this.roomRoute(this.roomId, rm);
        return door ? G.doorTarget(door) : null;
      }
      if (t.kind === 'npc') { const n = this.npcs[t.id]; return n ? { x: n.x, y: n.y - 24 } : null; }
      const r = this.rooms[rm] || { props: [], doors: [] };
      const p = (r.props || []).find((q) => q.id === t.id);
      if (p) return { x: (p.x + p.w / 2) * TS, y: (p.y + p.h / 2) * TS };
      const d = (r.doors || []).find((q) => q.id === t.id);
      if (d) return G.doorTarget(d);
      return null;
    }
    refreshTarget(dt) {
      this.targetT -= dt;
      if (this.targetT <= 0) { this.targetT = 0.8; this.target = this.st.nextAction(); }
    }

    // ---------- actualización
    update(dt, enabled) {
      this.time += dt;
      const st = this.st;
      this.updateFx(dt);
      this.refreshTarget(dt);
      // burbujas
      this.players.concat(this.npcsHere()).forEach((a) => { if (a.bubble) { a.bubble.t -= dt; if (a.bubble.t <= 0) a.bubble = null; } });
      if (!enabled) { this.players.forEach((a) => { a.moving = false; }); return; }

      const speed = G.stats().speed * 2.6;
      // jugadores humanos
      this.players.forEach((a) => {
        if (a.ctrl === 'ai' || a.ctrl === 'remote') return;
        const inp = G.input.p[a.ctrl === 'p1' ? 1 : 0];
        let mx = inp.mx, my = inp.my;
        if (a.work) {
          const w = a.work;
          const moved = Math.hypot(mx, my) > 0.2;
          if (moved && w.dur > 0.6 && !(w.kind === 'prop' && w.target.stay)) {
            a.work = null;
            a.say('¡Me he movido!', 1.2);
            G.audio.sfx('back');
          } else {
            this.stepWork(a, dt);
          }
          a.moving = false;
        } else {
          const len = Math.hypot(mx, my);
          if (len > 0.05) {
            const sp = speed * a.speedMul;
            this.moveActor(a, mx * sp * dt, my * sp * dt);
            this.setFace(a, mx, my);
            a.moving = true;
            a.anim += dt;
          } else a.moving = false;
          if (inp.tool) this.cycleTool(a);
        }
        a.focus = a.work ? a.focus : this.findFocus(a);
        if (inp.action && !a.work) this.interact(a);
      });
      // IA del compañero
      this.updateCompanion && this.updateCompanion(dt);
      this.players.forEach((a) => { if (a.ctrl === 'ai' && a.work) this.stepWork(a, dt); });
      this.updateCoop(dt);
      this.updateNPCs(dt);
      this.updateCamera(dt);
      // linterna UV automática (visible)
      // sonido ambiente de la herramienta de grabar
    }
    stepWork(a, dt) {
      const w = a.work;
      if (!w) return;
      // vigilante (sigilo)
      if (w.watcher) {
        const n = this.npcs[w.watcher];
        const seen = n && n.watching;
        if (seen) {
          a.work = null;
          this.out.push({ t: 'spotted', who: a.id, npc: w.watcher });
          n.say(G.watchConfig(this.st.def, w.watcher).spotted, 2.6);
          a.say('¡Nos ha visto casi!', 2);
          G.audio.sfx('error');
          this.puff(a.x, a.y - 30);
          return;
        }
      }
      w.t += dt;
      w.tick += dt;
      if (w.tick > 0.22) { w.tick = 0; G.audio.sfx('work'); }
      if (w.t >= w.dur) {
        a.work = null;
        if (w.kind === 'prop') this.completeStep(w.target, w.step, a);
        else this.completeDoorWork(w.target, w.step, a);
      }
    }
    updateNPCs(dt) {
      const st = this.st;
      const ps = this.players;
      this.npcsHere().forEach((n) => {
        // mirar al jugador más cercano si está cerca
        let near = null, nd = 1e9;
        ps.forEach((p) => { const d = G.dist(p.x, p.y, n.x, n.y); if (d < nd) { nd = d; near = p; } });
        if (n.cat) {
          n.anim += dt;
          if (n.wanderList && n.wanderList.length) {
            n.wanderT -= dt;
            if (!n.dest && n.wanderT <= 0) { n.dest = n.wanderList[Math.floor(Math.random() * n.wanderList.length)]; }
            if (n.dest) {
              const dx = n.dest.x - n.x, dy = n.dest.y - n.y, d = Math.hypot(dx, dy);
              if (d < 4) { n.dest = null; n.wanderT = 3 + Math.random() * 5; n.moving = false; }
              else { this.moveActor(n, (dx / d) * 52 * dt, (dy / d) * 52 * dt); this.setFace(n, dx, 0); n.moving = true; }
            }
          }
          if (nd < 70 && !n.bubble && Math.random() < dt * 0.15) { n.say('Miau', 1.5); G.audio.sfx('meow'); }
          return;
        }
        // vigilante: alterna mirar al frente / de espaldas si algún objeto de esta sala lo nombra en «watcher» (ritmo: G.watchConfig)
        if (this.room.props.some((p) => p.watcher === n.id)) {
          const wc = G.watchConfig(st.def, n.id);
          n.watching = G.watchLooking(wc, st.diff.id, this.time);
          if (n.watching) n.face = wc.face.watching; else if (!n.faceLock) n.face = wc.face.idle;
          return;
        }
        if (nd < 90) this.faceToward(n, near.x, near.y);
      });
    }

    // ============================================================ DIBUJO
    draw(ctx, dt) {
      const vps = this.viewports();
      ctx.fillStyle = '#120a1c';
      ctx.fillRect(0, 0, G.VW, G.VH);
      vps.forEach((vp, i) => this.drawView(ctx, vp, this.cam[i], null, i));
    }
    actorSpriteName(a) {
      if (a.cat) return 'cat_' + (a.moving ? 'walk' : 'sit') + '_' + (Math.floor(a.anim * 6) % 2);
      const dir = a.face === 'up' ? 'up' : a.face === 'down' ? 'down' : 'side';
      let fr = a.moving ? Math.floor(a.anim * 7) % 2 : 0;
      if (G.spr[`${a.look}_${dir}_2`]) fr = a.moving ? 1 + fr : 0; // personajes con 3 fotogramas: 0 = quieto, 1-2 = pasos
      if (dir === 'side' && a.face === 'left' && G.spr[`${a.look}_sideL_${fr}`]) return `${a.look}_sideL_${fr}`; // perfil izquierdo propio (pelo de Oli)
      return `${a.look}_${dir}_${fr}`;
    }
    drawActor(ctx, a) {
      const name = this.actorSpriteName(a);
      const s = G.spr[name];
      if (!s) return;
      G.drawSpr(ctx, 'shadow', a.x - 8 * S, a.y - 3 * S, { scale: S });
      const flip = a.face === 'left' && name.indexOf('_sideL_') < 0;
      let bob = a.moving ? Math.abs(Math.sin(a.anim * 14)) * 2 : 0;
      if (!a.moving && !a.cat && G.ANIM_BREATH !== false) bob = this.breath(a); // 4C-3b-1: respira en reposo (1 px lógico, solo visual)
      if (a.cat) G.drawSpr(ctx, name, a.x - 8 * S, a.y - 12 * S + 2, { scale: S, flip: a.face === 'left' });
      else G.drawSpr(ctx, name, a.x - 8 * S, a.y - 22 * S + 4 - bob, { scale: S, flip });
    }
    breath(a) { if (a.breathPh === undefined) a.breathPh = (G.hash(String(a.id)) % 628) / 100; return Math.sin(this.time * 2.1 + a.breathPh) > 0.5 ? G.S / 3 : 0; } // la fase se calcula una vez por personaje (no un hash por fotograma)
    propSprite(p) {
      if (p.swap && this.st.flags[p.swap.flag]) return p.swap.sprite;
      return p.sprite;
    }
    drawProp(ctx, p, t) {
      let name = this.propSprite(p);
      if (!name) return;
      if (p.animOn) name = G.animFrame(name, t, p.id);
      const s = G.spr[name];
      if (!s) return;
      const x = p.x * TS + ((p.w * TS - s.tw * S) / 2);
      const y = (p.y + p.h) * TS - s.th * S + (p.dy || 0) * S;
      let yy = y;
      if (p.pigeon) yy += Math.abs(Math.sin(t * 3 + p.t0)) * -2 + (Math.sin(t * 0.7 + p.t0) > 0.95 ? -6 : 0);
      G.drawSpr(ctx, name, x, yy, { scale: S });
    }
    // Capa de suelo animada (4C-3b-1): decoración y charcos animados, y los resplandores (sirena, farola) bajo los objetos y personajes.
    drawAnimLayer(ctx, t) {
      const room = this.room;
      if (!room.animCount) return;
      room.animDecor.forEach((d) => {
        const st = G.animState(d.sprite, t, d.key);
        if (!st) return;
        G.drawSpr(ctx, st.name, d.x * TS, d.y * TS, { scale: S });
        if (st.glow) { const s = G.spr[d.sprite]; this.drawGlow(ctx, st.glow, d.x * TS + (s ? s.tw : 16) * S / 2, d.y * TS + (s ? s.th : 16) * S); }
      });
      room.props.forEach((p) => {
        if (!p.animOn || !this.propVisible(p) || p.uvOnly) return;
        const st = G.animState(this.propSprite(p), t, p.id);
        if (st && st.glow) this.drawGlow(ctx, st.glow, p.x * TS + p.w * TS / 2, (p.y + p.h) * TS);
      });
    }
    drawGlow(ctx, g, cx, by) {
      const s = G.spr[g.sprite];
      if (!s) return;
      G.drawSpr(ctx, g.sprite, cx - s.tw * S / 2 + g.dx * S, by - s.th * S / 2 + g.dy * S, { scale: S });
    }
    shimmerOn(p, a) {
      const d = this.st.diff;
      if (d.sparkle === 'all') return true;
      if (this.hintIds[p.id]) return true;
      const sn = G.stats().sniff;
      if (sn && a) { const c = this.propCenter(p); if (G.dist(a.x, a.y, c.x, c.y) < sn * S * 1.2) return true; }
      return false;
    }
    drawView(ctx, vp, cam, only, vi) {
      const room = this.room, st = this.st, t = this.time;
      ctx.save();
      ctx.beginPath();
      ctx.rect(vp.x, vp.y, vp.w, vp.h);
      ctx.clip();
      ctx.fillStyle = '#120a1c';
      ctx.fillRect(vp.x, vp.y, vp.w, vp.h);
      ctx.save();
      ctx.translate(Math.round(vp.x - cam.x), Math.round(vp.y - cam.y));
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(room.static, 0, 0);
      this.drawAnimLayer(ctx, t);
      // puertas
      room.doors.forEach((d) => {
        const state = this.doorState(d);
        let name = d.sprite;
        if (state !== 'open') name = d.lockedSprite || d.sprite;
        else {
          const rc = G.doorRect(d);
          const near = this.players.some((p) => !p.hidden && G.rectDist(p.x, p.y, rc[0], rc[1], rc[2], rc[3]) < 60);
          if (near && G.spr[d.sprite + '_open']) name = d.sprite + '_open';
        }
        G.drawSpr(ctx, name, d.x * TS, (d.y || 0) * TS, { scale: S });
      });
      // objetos y personajes ordenados por profundidad
      const list = [];
      room.props.forEach((p) => {
        if (!this.propVisible(p) || p.uvOnly) return;
        list.push({ k: (p.y + p.h) * TS + (p.solid ? 0 : 2), o: p, type: 'p' });
      });
      this.players.forEach((a) => { if (!a.hidden) list.push({ k: a.y, o: a, type: 'a' }); });
      this.npcsHere().forEach((a) => list.push({ k: a.y, o: a, type: 'a' }));
      list.sort((a, b) => a.k - b.k);
      list.forEach((e) => (e.type === 'p' ? this.drawProp(ctx, e.o, t) : this.drawActor(ctx, e.o)));
      // brillos de pista
      room.props.forEach((p) => {
        const info = this.propStepInfo(p);
        if (!info || info.done || !p.shimmer) return;
        const a = only || this.leader();
        if (!this.shimmerOn(p, a)) return;
        const c = this.propCenter(p);
        if (p.uvOnly) { const k2 = 0.5 + 0.5 * Math.sin(t * 3 + p.t0); U().icon(ctx, 'ico_question', c.x - 14, c.y - 40 - k2 * 4, 28); return; }
        const k = 0.5 + 0.5 * Math.sin(t * 4 + p.t0);
        G.drawSpr(ctx, 'sparkle', c.x - 4 * S, c.y - 26 - k * 5, { scale: S * (0.7 + k * 0.5), alpha: 0.9 });
      });
      // partículas
      this.fx.forEach((f) => {
        const a = 1 - f.t / f.life;
        ctx.globalAlpha = a;
        if (f.k === 'spark') G.drawSpr(ctx, 'sparkle', f.x - 4 * S * 0.5, f.y - 4 * S * 0.5, { scale: S * 0.5 * (0.6 + a) });
        else { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.4 - a * 0.6), 0, 6.3); ctx.fill(); }
        ctx.globalAlpha = 1;
      });
      ctx.restore();

      // ---- luz UV
      const uvs = this.uvSources();
      if (uvs.length) this.drawUV(ctx, vp, cam, uvs);

      // ---- ambiente
      const amb = room.def.ambient;
      if (amb) { ctx.fillStyle = amb; ctx.fillRect(vp.x, vp.y, vp.w, vp.h); }
      this.drawVignette(ctx, vp);
      this.drawMood(ctx, vp, t); // 4C-4b: luz tenue, niebla o polvo (solo en inquietante y macabro)

      // ---- elementos de interfaz en el mundo
      const w2s = (x, y) => ({ x: vp.x + x - cam.x, y: vp.y + y - cam.y });
      // interrogantes sobre PNJ
      this.npcsHere().forEach((n) => {
        if (n.cat) return;
        const nd = st.def.npcs[n.id];
        const fresh = !st.flags['talked_' + n.id] || st.topicsFor(n.id).some((q) => !q.seen);
        if (fresh) {
          const s = w2s(n.x, n.y - 26 * S - 6 - Math.abs(Math.sin(t * 3 + n.x)) * 4);
          U().icon(ctx, st.flags['talked_' + n.id] ? 'ico_exclaim' : 'ico_question', s.x - 14, s.y - 10, 28);
        }
      });
      // burbujas
      this.players.concat(this.npcsHere()).forEach((a) => {
        if (!a.bubble || a.hidden) return;
        if (only && a !== only && !a.isNpc) return;
        const s = w2s(a.x, a.y - (a.cat ? 14 * S : 24 * S) - 8);
        U().bubble(ctx, a.bubble.text, s.x, s.y, { alpha: Math.min(1, a.bubble.t * 3) });
      });
      // anillos de progreso y avisos
      this.players.forEach((a) => {
        if (a.hidden) return;
        if (a.work) this.drawRing(ctx, w2s(a.x, a.y - 24 * S - 12), a.work.t / a.work.dur, a.work.tool ? G.TOOLS[a.work.tool].icon : 'ico_hand');
        if (this.coopWork && (a.ctrl === 'remote' ? a.rPush : a.pushing)) {
          const s = w2s(a.x, a.y - 24 * S - 12);
          this.drawRing(ctx, s, this.coopWork.t / this.coopWork.dur, 'ico_hand');
        }
      });
      // flecha objetivo
      const lead = only || this.leader();
      if (this.arrowOn) this.drawArrow(ctx, vp, cam, lead);
      // indicador de jugador (solo cuando hay dos en pantalla)
      if (this.mode === 'online') {
        this.players.forEach((a) => {
          if (a.hidden) return;
          const s = w2s(a.x, a.y - 24 * S - 14);
          const col = a.id === 'rex' ? '#f0909c' : '#8cc4f0';
          ctx.fillStyle = col;
          ctx.beginPath(); ctx.moveTo(s.x - 5, s.y - 9); ctx.lineTo(s.x + 5, s.y - 9); ctx.lineTo(s.x, s.y); ctx.closePath(); ctx.fill();
          if (a.ctrl === 'remote') U().text(ctx, G.ROLES[a.id].name, s.x, s.y - 28, { size: 12, align: 'center', color: col });
        });
      } else if (!only && this.mode === 'coop') {
        this.players.forEach((a, i) => {
          const s = w2s(a.x, a.y - 24 * S - 18);
          const col = a.id === 'rex' ? '#f0909c' : '#8cc4f0';
          ctx.fillStyle = col;
          ctx.beginPath(); ctx.moveTo(s.x - 6, s.y - 10); ctx.lineTo(s.x + 6, s.y - 10); ctx.lineTo(s.x, s.y); ctx.closePath(); ctx.fill();
          U().text(ctx, 'J' + (i + 1), s.x, s.y - 28, { size: 12, align: 'center', color: col });
        });
      } else if (this.mode === 'solo' || this.aiTakeover) {
        const a = this.leader();
        const s = w2s(a.x, a.y - 24 * S - 14);
        ctx.fillStyle = a.id === 'rex' ? '#f0909c' : '#8cc4f0';
        ctx.beginPath(); ctx.moveTo(s.x - 5, s.y - 9); ctx.lineTo(s.x + 5, s.y - 9); ctx.lineTo(s.x, s.y); ctx.closePath(); ctx.fill();
      }
      // prompt de acción
      const prompt = (a, i) => {
        if (!a.focus || a.work || a.ctrl === 'ai' || a.ctrl === 'remote') return;
        if (only && a !== only) return;
        const f = a.focus;
        const s = w2s(a.x, a.y - 24 * S - 36);
        const key = G.input.touch.enabled ? 'A' : G.keyLabel(a.ctrl === 'p1' ? 1 : 0);
        let txt = f.verb + (f.label && f.kind !== 'npc' ? ': ' + f.label : f.kind === 'npc' ? ' con ' + f.label : '');
        if (f.kind === 'door') txt = (f.state === 'wait' ? 'Cerrada: ' : f.verb + ': ') + f.label;
        ctx.save();
        ctx.font = U().font(15);
        const w = ctx.measureText(txt).width + 64;
        const bad = f.needs && !f.mine && this.mode === 'coop';
        U().panel(ctx, s.x - w / 2, s.y - 26, w, 34, { fill: 'rgba(30,18,50,0.93)', stroke: bad ? '#ff7a6b' : '#ffd45a', r: 17, shadow: false });
        ctx.restore();
        U().icon(ctx, f.icon, s.x - w / 2 + 8, s.y - 23, 26);
        U().text(ctx, txt, s.x - w / 2 + 38, s.y - 19, { size: 15, color: bad ? '#ffb0a8' : '#fff4dc' });
        const kw = Math.max(22, U().measure(ctx, key, 13) + 12);
        U().panel(ctx, s.x + w / 2 - kw - 4, s.y - 22, kw, 26, { fill: '#ffd45a', stroke: '#c9a000', r: 6, shadow: false, lw: 1 });
        U().text(ctx, key, s.x + w / 2 - kw / 2 - 4, s.y - 18, { size: 13, color: '#2a1b30', align: 'center', shadow: false });
      };
      this.players.forEach(prompt);
      ctx.restore();
    }
    drawRing(ctx, s, frac, icon) {
      ctx.save();
      ctx.fillStyle = 'rgba(30,18,50,0.9)';
      ctx.beginPath(); ctx.arc(s.x, s.y, 22, 0, 6.3); ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.18)';

    show(lines, after) {

    openMenu() {

        items.push({ kind: 'present', label: 'Mostrar una prueba…', icon: 'ico_clue', disabled: st.clueCount() === 0 });
      }

    openPicker() {

    update(dt) {

      if (this.stage === 'say') {
        if (m.ok || G.input.mouse.clicked) {
          if (!this.typer.done) this.typer.skip();
          else {
            this.li++;
            if (this.li >= this.lines.length) { const f = this.after; this.after = null; f ? f() : this.openMenu(); }
            else { this.typer.set(this.lines[this.li]); G.speak(this.lines[this.li]); G.audio.sfx('select'); }
          }
        }
        return;
      }
      if (this.stage === 'menu') {
        const r = this.menu.update();
        if (r.back) return 'done';
        if (r.chosen >= 0) {
          const it = this.menu.items[r.chosen];
          const st = this.st;
          if (it.kind === 'bye') return 'done';
          if (it.kind === 'topic') this.apply(st.ask(this.id, it.id), it.label);
          else if (it.kind === 'chat') { const res = st.chat(this.id); this.apply(res, null); this.s.dir.bump(); }

      if (this.stage === 'pick') {
        const r = this.pick.update();
        if (r.back) { this.openMenu(); return; }
        if (r.chosen >= 0) {
          const it = this.pick.items[r.chosen];

  // ------------------------------------------------------------ MODAL: cuaderno de detective
  class Notebook {
    constructor(scene, tab) {
      this.s = scene;
      this.st = scene.st;
      this.tab = tab || 0;
      this.sel = [0, 0, 0];
      this.acc = { culprit: null, method: null, motive: null, proof: [] };
      this.sub = 'slots';
      this.slots = null;
      this.chooser = null;
      this.confirm = null;
      this.t = 0;
      this.buildSlots();
    }
    tabsDef() { return ['Pistas', 'Sospechosos', 'Testimonios', 'Acusar']; }
    buildSlots() {
      const o = this.st.boardOptions(), sol = this.st.def.solution;
      const A = this.acc;
      const nameOf = (list, id) => { const f = list.find((x) => x.id === id); return f ? f.name || f.text : '—'; };
      const items = [];
      items.push({ k: 'culprit', label: '¿Quién fue?', right: A.culprit ? nameOf(this.st.def.suspects, A.culprit) : '—', icon: 'ico_question' });
      if (o.method) items.push({ k: 'method', label: '¿Cómo lo hizo?', right: A.method ? '✔' : '—', sub: A.method ? sol.methods.find((m) => m.id === A.method).text : 'Elige el método', icon: 'ico_lupa', h: 54 });
      if (o.motive) items.push({ k: 'motive', label: '¿Por qué?', right: A.motive ? '✔' : '—', sub: A.motive ? sol.motives.find((m) => m.id === A.motive).text : 'Elige el motivo', icon: 'ico_bulb', h: 54 });
      if (o.proof) items.push({ k: 'proof', label: 'Pruebas clave', right: A.proof.length + '/3', sub: 'Elige hasta 3 pistas que lo demuestren', icon: 'ico_clue', h: 54 });
      const ready = A.culprit && (!o.method || A.method) && (!o.motive || A.motive) && (!o.proof || A.proof.length >= 2);
      items.push({ k: 'go', label: '¡ACUSAR!', icon: 'ico_star', disabled: !ready, color: C.accent });
      const keep = this.slots ? this.slots.sel : 0;
      this.slots = new U.Menu(items, { x: 70, y: 168, w: 380, h: 44, gap: 8 });
      this.slots.sel = G.clamp(keep, 0, items.length - 1);
    }
    openChooser(k) {
      const st = this.st, sol = st.def.solution, o = st.boardOptions();
      const items = [];
      if (k === 'culprit') o.suspects.forEach((s) => items.push({ id: s.id, label: s.name, sub: s.desc, h: 52, right: st.diff.autoMark && st.suspectCleared(s.id) ? 'descartado' : '', rightColor: C.dim }));
      if (k === 'method') sol.methods.forEach((m) => items.push({ id: m.id, label: m.text, right: st.diff.autoMark && m.needs && m.needs.length ? (m.needs.every((c) => st.hasClue(c)) ? 'hay pistas' : 'sin pistas') : '', rightColor: m.needs && m.needs.every((c) => st.hasClue(c)) ? C.good : C.dim }));
      if (k === 'motive') sol.motives.forEach((m) => items.push({ id: m.id, label: m.text, right: st.diff.autoMark && m.needs && m.needs.length ? (m.needs.every((c) => st.hasClue(c)) ? 'hay pistas' : 'sin pistas') : '', rightColor: m.needs && m.needs.every((c) => st.hasClue(c)) ? C.good : C.dim }));
      if (k === 'proof') {
        st.clueOrder.forEach((c) => items.push({ id: c, label: st.def.clues[c].title, icon: st.def.clues[c].icon, right: this.acc.proof.indexOf(c) >= 0 ? '✔' : '', rightColor: C.good }));
        items.push({ id: '__done', label: 'Listo', icon: 'ico_arrow' });
      }
      this.chooser = { k, menu: new U.Menu(items.slice(0, 11), { x: 480, y: 136, w: 400, h: 40, gap: 5 }) };
      this.sub = 'choose';
    }
    update(dt) {
      this.t += dt;
      const m = G.input.menu, st = this.st;
      const mouse = G.input.mouse;
      if (this.sub === 'confirm') {
        const r = this.confirm.update();
        if (r.back) { this.sub = 'slots'; return; }
        if (r.chosen === 0) { this.s.onAccuse({ culprit: this.acc.culprit, method: this.acc.method, motive: this.acc.motive, proof: this.acc.proof }); return 'done'; }
        if (r.chosen === 1) this.sub = 'slots';
        return;
      }
      if (this.sub === 'choose') {
        const r = this.chooser.menu.update();
        if (r.back) { this.sub = 'slots'; return; }
        if (r.chosen >= 0) {
          const it = this.chooser.menu.items[r.chosen], k = this.chooser.k;
          if (k === 'proof') {
            if (it.id === '__done') { this.sub = 'slots'; this.buildSlots(); return; }
            const i = this.acc.proof.indexOf(it.id);
            if (i >= 0) this.acc.proof.splice(i, 1); else if (this.acc.proof.length < 3) this.acc.proof.push(it.id);
            it.right = this.acc.proof.indexOf(it.id) >= 0 ? '✔' : '';
          } else { this.acc[k] = it.id; this.sub = 'slots'; this.buildSlots(); }
        }
        return;
      }
      // pestañas
      const tabs = this.tabsDef();
      if (m.back) return 'done';
      if (this.tab !== 3) {
        if (m.left) { this.tab = (this.tab + tabs.length - 1) % tabs.length; G.audio.sfx('select'); }
        if (m.right) { this.tab = (this.tab + 1) % tabs.length; G.audio.sfx('select'); }
      } else if (this.sub === 'slots') {
        const r = this.slots.update();
        if (m.left) { this.tab = 2; G.audio.sfx('select'); }
        if (r.chosen >= 0) {
          const it = this.slots.items[r.chosen];
          if (it.k === 'go') { this.confirm = new U.Menu([{ label: 'Sí, ¡acusar!', icon: 'ico_star', color: C.accent }, { label: 'Seguir investigando', icon: 'ico_arrow' }], { x: 490, y: 320, w: 340, h: 46, gap: 8 }); this.sub = 'confirm'; }
          else this.openChooser(it.k);
        }
      }
      if (mouse.clicked) {
        const tw = 150;
        tabs.forEach((t, i) => { if (U.hit(70 + i * (tw + 8), 44, tw, 38)) { this.tab = i; G.audio.sfx('select'); this.sub = 'slots'; } });
        if (U.hit(G.VW - 100, 44, 56, 38)) return 'done';

      // listas
      if (this.tab === 0) {
        const n = st.clueOrder.length;
        if (n) {
          if (m.up) this.sel[0] = (this.sel[0] + n - 1) % n;
          if (m.down) this.sel[0] = (this.sel[0] + 1) % n;
          if (mouse.clicked) {
            const base = Math.max(0, Math.min(this.sel[0] - 3, n - 8));
            for (let i = 0; i < Math.min(8, n); i++) if (U.hit(70, 104 + i * 46, 330, 42)) this.sel[0] = base + i;
            if (U.hit(300, 472, 44, 34)) { this.sel[0] = (this.sel[0] + n - 1) % n; G.audio.sfx('select'); }
            if (U.hit(350, 472, 44, 34)) { this.sel[0] = (this.sel[0] + 1) % n; G.audio.sfx('select'); }
          }
        }
      }
      if (this.tab === 1) {
        const list = st.boardOptions().suspects, n = list.length;
        if (m.up || m.left) this.sel[1] = (this.sel[1] + n - 1) % n;
        if (m.down || m.right) this.sel[1] = (this.sel[1] + 1) % n;
        if (mouse.clicked) { const cw = Math.min(200, (G.VW - 160) / n - 10); for (let i = 0; i < n; i++) if (U.hit(70 + i * (cw + 12), 104, cw, 360)) { this.sel[1] = i; G.audio.sfx('select'); } }
      }
      if (this.tab === 2) {
        const n = Math.max(1, this.testimonyNpcs().length);

        if (m.down) this.sel[2] = (this.sel[2] + 1) % n;

      }
    }

  // ------------------------------------------------------------ MODAL: minijuegos (código y línea de tiempo)
  class Mini {
    constructor(scene, cfg) {
      this.s = scene; this.cfg = cfg; this.t = 0; this.solved = false; this.shake = 0; this.doneT = 0;
      if (cfg.type === 'code') { this.entry = ''; this.keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'X']; }
      else {
        const ev = cfg.events.map((e, i) => Object.assign({ i }, e));
        const r = G.rng(cfg.events.length * 7 + 3);
        let guard = 0;
        do { for (let k = ev.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); const tmp = ev[k]; ev[k] = ev[j]; ev[j] = tmp; } } while (ev.every((e, i) => e.i === i) && guard++ < 20);
        this.ev = ev; this.picked = [];
        this.menu = new U.Menu(this.items(), { x: 150, y: 128, w: 660, h: 56, gap: 8 });
      }
    }
    items() {
      return this.ev.map((e) => {
        const n = this.picked.indexOf(e.i);
        const it = { label: e.text, sub: e.clue ? 'Según: ' + this.s.st.def.clues[e.clue].title : '', h: 56 };
        if (n >= 0) { it.disabled = true; it.right = this.cfg.events[e.i].time || (n + 1) + 'º'; it.rightColor = C.good; }
        return it;
      });
    }
    wrong(msg) {
      this.shake = 0.5; G.audio.sfx('error'); U.toast(msg, 2.6, { color: C.bad }); this.s.dir.denied();
    }
    win() { this.solved = true; this.doneT = 0.9; G.audio.sfx('unlock'); }
    press(ch) {
      if (this.solved || this.shake > 0) return;
      const code = this.cfg.code;
      if (ch === '⌫') { this.entry = this.entry.slice(0, -1); G.audio.sfx('select'); return; }
      if (ch === 'X') { this.closing = true; return; }
      if (this.entry.length >= code.length) return;
      this.entry += ch; G.audio.sfx('tool');
      if (this.entry.length === code.length) { if (this.entry === code) this.win(); else { this.wrong('Código incorrecto.'); this.entry = ''; } }
    }
    keyRects() {
      const out = [];
      this.keys.forEach((k, i) => out.push({ k, x: 350 + (i % 3) * 90, y: 250 + Math.floor(i / 3) * 60, w: 80, h: 52 }));
      return out;
    }
    update(dt) {
      this.t += dt;
      if (this.shake > 0) this.shake -= dt;
      if (this.solved) { this.doneT -= dt; if (this.doneT <= 0) return 'done'; return; }
      const m = G.input.menu, I = G.input;
      if (m.back || this.closing) return 'done';
      if (this.cfg.type === 'code') {
        for (let d = 0; d <= 9; d++) if (I.keyPressed('Digit' + d) || I.keyPressed('Numpad' + d)) this.press(String(d));
        if (I.keyPressed('Backspace')) this.press('⌫');
        if (I.mouse.clicked) {
          this.keyRects().forEach((r) => { if (U.hit(r.x, r.y, r.w, r.h)) this.press(r.k); });
          if (U.hit(640, 32, 36, 36)) return 'done';
        }
        return;
      }
      if (I.mouse.clicked && U.hit(790, 32, 36, 36)) return 'done';
      this.menu.setItems(this.items());
      const r = this.menu.update();
      if (r.chosen >= 0 && this.shake <= 0) {
        const e = this.ev[r.chosen];
        if (e.i === this.picked.length) {
          this.picked.push(e.i); G.audio.sfx('pickup');
          if (this.picked.length === this.ev.length) this.win();
        } else { this.picked = []; this.wrong('Ese no es el siguiente suceso. Empieza otra vez.'); }
      }
    }
    draw(ctx) {
      ctx.fillStyle = 'rgba(12,6,22,0.8)'; ctx.fillRect(0, 0, G.VW, G.VH);
      const sx = this.shake > 0 ? Math.sin(this.t * 70) * 7 : 0;
      ctx.save(); ctx.translate(sx, 0);
      if (this.cfg.type === 'code') {
        U.panel(ctx, 280, 24, 400, 480, { lw: 3 });
        U.text(ctx, this.cfg.title || 'Candado', 480, 38, { size: 22, align: 'center', color: C.accent });
        U.text(ctx, this.cfg.hint || '', 480, 76, { size: 15, align: 'center', maxW: 360, bold: false, lineH: 20 });
        const n = this.cfg.code.length, w = 62, gap = 10, x0 = 480 - (n * w + (n - 1) * gap) / 2;
        for (let i = 0; i < n; i++) {
          U.panel(ctx, x0 + i * (w + gap), 160, w, 70, { fill: this.solved ? '#235a34' : 'rgba(12,6,22,0.9)', stroke: this.solved ? C.good : C.accent, shadow: false, r: 10 });
          U.text(ctx, this.entry[i] || (this.solved ? this.cfg.code[i] : ''), x0 + i * (w + gap) + w / 2, 170, { size: 44, align: 'center' });
        }
        this.keyRects().forEach((r) => {
          const hov = U.hit(r.x, r.y, r.w, r.h);
          U.panel(ctx, r.x, r.y, r.w, r.h, { fill: hov ? '#6a47b8' : 'rgba(70,50,110,0.92)', stroke: hov ? C.accent : '#7d62b8', shadow: false, r: 10 });
          U.text(ctx, r.k === 'X' ? 'Cerrar' : r.k, r.x + r.w / 2, r.y + (r.k === 'X' ? 17 : 8), { size: r.k === 'X' ? 15 : 28, align: 'center' });
        });
        U.panel(ctx, 640, 32, 36, 36, { fill: 'rgba(70,50,110,0.9)', shadow: false, r: 8 });
        U.text(ctx, '✕', 658, 39, { size: 18, align: 'center' });
        if (this.solved) U.text(ctx, '¡Se abre!', 480, 485, { size: 18, align: 'center', color: C.good });
      } else {
        U.panel(ctx, 130, 24, 700, 492, { lw: 3 });
        U.text(ctx, this.cfg.title || 'Línea de tiempo', 480, 36, { size: 24, align: 'center', color: C.accent });
        U.text(ctx, this.cfg.hint || 'Toca los sucesos de lo más antiguo a lo más reciente.', 480, 76, { size: 15, align: 'center', maxW: 620, bold: false });
        this.menu.draw(ctx);
        U.text(ctx, this.picked.length + ' de ' + this.ev.length + ' colocados', 480, 490, { size: 14, align: 'center', color: C.dim, bold: false });
        U.panel(ctx, 790, 32, 36, 36, { fill: 'rgba(70,50,110,0.9)', shadow: false, r: 8 });
        U.text(ctx, '✕', 808, 39, { size: 18, align: 'center' });
      }
      ctx.restore();
    }
  }
